# pnpm 11 runs no dependency build script unless allowed: Electron fetches its binary in one. electron-winstaller
# (Squirrel.Windows, pulled in by electron-builder) is unused: the Windows installer is NSIS.
allowBuilds:
  electron: true
  electron-winstaller: false
# makensis (the Windows installer's compiler) overflows a stack buffer on an include path of about 275 characters, and
# electron-builder's templates sit under node_modules/.pnpm/<package and peers>/: a shorter store dir name keeps the
# installer buildable in a deep checkout such as an agent's worktree.
virtualStoreDirMaxLength: 60
