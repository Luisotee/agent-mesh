syntax = "proto3";

package agentmesh.relay.v1;

// ControlFrame is one binary WebSocket message on the daemon-to-relay control connection
// (`/v1/daemon/control`). After the WebSocket upgrade (authenticated by the relay bearer token), the daemon
// sends Register and waits for Registered.
message ControlFrame {
  oneof frame {
    // Daemon to relay.
    Register register = 1;
    DialBack dial_back = 2;
    Ping ping = 3;
    ClientTokens client_tokens = 4;
    // Relay to daemon.
    Registered registered = 10;
    Pong pong = 11;
  }
}

message Register {
  string host_id = 1;
  string host_name = 2;
  string daemon_version = 3;
  // The daemon gives the relay its devices' tokens: the relay then accepts a client only by a token in
  // client_tokens (or a later ClientTokens), never by the host-wide token derived from the relay secret.
  bool device_tokens = 4;
  repeated ClientToken client_tokens = 5;
}

// ClientTokens replaces the set of client tokens the relay accepts for this host (daemon to relay, after
// Registered), sent whenever a pairing is made or redeemed or a device is revoked.
message ClientTokens {
  repeated ClientToken tokens = 1;
}

// ClientToken is one client relay token the relay accepts, by its hash: the relay never holds the token.
message ClientToken {
  // SHA-256 of the token as the client sends it in its preamble.
  bytes sha256 = 1;
  // Unix seconds after which the relay refuses it (a pairing not yet redeemed); 0 is no expiry.
  int64 expires_unix = 2;
}

message Registered {
  string host_id = 1;
}

// DialBack asks the daemon to open a WebSocket to `/v1/daemon/stream?ticket=<ticket>` for a waiting app
// connection; the relay then splices the raw byte streams without inspecting them.
message DialBack {
  string ticket = 1;
  string stream_id = 2;
}

message Ping {
  int64 seq = 1;
}

message Pong {
  int64 seq = 1;
}
