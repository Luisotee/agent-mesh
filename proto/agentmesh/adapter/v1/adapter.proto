syntax = "proto3";

package agentmesh.adapter.v1;

import "agentmesh/v1/types.proto";
import "google/protobuf/timestamp.proto";

// CliAdapterService is the plugin interface for an agent CLI: what to run, and what its hooks mean. Built-in
// adapters implement it in the daemon's process; a process plugin serves the same service over its own socket.
// Everything CLI-specific lives behind it; the daemon handles only the neutral AgentEvents it returns.
service CliAdapterService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc PlanLaunch(PlanLaunchRequest) returns (PlanLaunchResponse);
  rpc DecodeHook(DecodeHookRequest) returns (DecodeHookResponse);
  rpc LookupSession(LookupSessionRequest) returns (LookupSessionResponse);
  // DescribeModel says what a model name fixes by itself; an adapter without it fixes nothing.
  rpc DescribeModel(DescribeModelRequest) returns (DescribeModelResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // The kind agents name it by, such as "claude".
  string kind = 1;
  string display_name = 2;
  // CLI versions its decoding was verified against; others get a warning.
  repeated string verified_versions = 3;
  repeated string capabilities = 4;
}

message PlanLaunchRequest {
  string agent_id = 1;
  string agent_name = 2;
  string run_id = 3;
  agentmesh.v1.AgentRole role = 4;
  string cwd = 5;
  string model = 6;
  string effort = 7;
  // The CLI's binary, from the host's settings.
  string binary = 8;
  // The command every hook runs, as argv; the adapter appends its own arguments (the event name).
  repeated string hook_argv = 9;
  // The environment to start from: the daemon's allowlist plus the agent's identity.
  map<string, string> env = 10;
  // Start the CLI with its permission prompts off.
  bool skip_permissions = 11;
  // The repository's main checkout. An ASKER or REVIEWER (read-only) agent may not edit it or its worktree.
  string repo = 12;
  // Reopen this conversation instead of starting one (`claude --resume <id>`).
  string resume_session_id = 13;
  // Deny edits under cwd and repo, and publishing, whatever the role: a planner not yet approved. A read-only
  // role is denied either way.
  bool deny_edits = 14;
}

message WorktreeFile {
  // Relative path inside the worktree (must not escape it).
  string path = 1;
  bytes content = 2;
  // File mode (0600 by default when 0).
  uint32 mode = 3;
  // Keep the file out of git status: an untracked one is ignored (a self-ignoring .gitignore beside it, so other
  // checkouts of the repo are untouched; <git-common-dir>/info/exclude only at the worktree's top), and a tracked
  // one is marked skip-worktree.
  bool git_exclude = 4;
  // The content is a JSON object. When the repo tracks the path and its committed version is a JSON object too,
  // the file written is that version with the content's top-level keys added (replacing any of the same name),
  // so the repo's own entries stay in force. Unset, the committed version unreadable, or not the version one of
  // the repo's own refs has (a local non-mesh branch or an origin branch), the content replaces it.
  bool merge_tracked = 5;
}

message PlanLaunchResponse {
  repeated string argv = 1;
  map<string, string> env = 2;
  // The conversation id, when the adapter chose it up front.
  string session_id = 3;
  // Files the adapter needs in the agent's worktree before launch (for CLIs without inline `--settings` hooks).
  repeated WorktreeFile worktree_files = 4;
}

// LookupSessionRequest finds an agent's conversation by its worktree: the newest top-level one there. The first
// prompt (a doorbell) names neither the agent nor the run, so nothing else ties a conversation to it.
message LookupSessionRequest {
  reserved 2, 3;
  reserved "agent_name", "run_id";
  string agent_id = 1;
  string cwd = 4;
  string repo = 5;
  map<string, string> env = 6;
  // When the agent was created: a conversation started before it (or untouched since) is someone else's.
  google.protobuf.Timestamp not_before = 7;
}

message LookupSessionResponse {
  string session_id = 1;
}

message DescribeModelRequest {
  string model = 1;
}

message DescribeModelResponse {
  // The effort the model's name fixes (an agy id such as `gemini-4-neon-low`), or empty.
  string effort = 1;
}

message DecodeHookRequest {
  string agent_id = 1;
  // The conversation id the daemon knows for the agent; hooks from another conversation are dropped.
  string session_id = 2;
  string event_name = 3;
  bytes payload = 4;
  google.protobuf.Timestamp fired_at = 5;
}

message DecodeHookResponse {
  repeated AgentEvent events = 1;
}

// AgentEvent is a neutral event an adapter derives from a hook, a stream or the process. One pure reducer turns
// a sequence of them into the agent's state.
message AgentEvent {
  google.protobuf.Timestamp time = 1;
  oneof kind {
    SessionStarted session_started = 10;
    TurnStarted turn_started = 11;
    Activity activity = 12;
    NeedsInput needs_input = 13;
    TurnEnded turn_ended = 14;
    Compacting compacting = 15;
    SessionEnded session_ended = 16;
    ProcessExited process_exited = 17;
    DecodeError decode_error = 18;
    RateLimited rate_limited = 19;
    TurnFailed turn_failed = 20;
  }
}

// The CLI is up and idle at its prompt (also after /clear or a resume).
message SessionStarted {
  string session_id = 1;
  // "startup", "resume", "clear", "compact".
  string source = 2;
}

message TurnStarted {}

// Something happened in a turn (a tool ran); keeps the agent from reading as unknown.
message Activity {
  string detail = 1;
}

// The CLI waits on the user: a permission prompt, a question.
message NeedsInput {
  string reason = 1;
}

message TurnEnded {}

message Compacting {}

message SessionEnded {
  string reason = 1;
}

message ProcessExited {
  int32 exit_code = 1;
  int32 signal = 2;
}

message DecodeError {
  string error = 1;
}

// The CLI hit a quota or rate limit (RESOURCE_EXHAUSTED 429, usage limit); ready for SwitchAgent.
message RateLimited {
  string message = 1;
  string reset_in = 2;
}

// The turn ended in a non-limit error.
message TurnFailed {
  string error = 1;
}
