syntax = "proto3";

package agentmesh.adapter.v1;

import "agentmesh/v1/chat.proto";
import "agentmesh/v1/context.proto";
import "agentmesh/v1/types.proto";
import "google/protobuf/timestamp.proto";

// CliAdapterService is the plugin interface for an agent CLI: what to run, and what its hooks mean. Built-in
// adapters implement it in the daemon's process; a process plugin serves the same service over its own socket.
// Everything CLI-specific lives behind it; the daemon handles only the neutral AgentEvents it returns.
service CliAdapterService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc PlanLaunch(PlanLaunchRequest) returns (PlanLaunchResponse);
  rpc DecodeHook(DecodeHookRequest) returns (DecodeHookResponse);
  rpc LookupSession(LookupSessionRequest) returns (LookupSessionResponse);
  // DescribeModel says what a model name fixes by itself; an adapter without it fixes nothing.
  rpc DescribeModel(DescribeModelRequest) returns (DescribeModelResponse);
  // ReadInputBox reads what the agent's input box holds from a terminal repaint, so a doorbell is never typed into a
  // human's draft and a typed one is known to have been submitted. An adapter without it reads as "unclear": the
  // daemon types as if the box were empty.
  rpc ReadInputBox(ReadInputBoxRequest) returns (ReadInputBoxResponse);
  // DeliverNative hands a doorbell to the CLI without typing into its terminal (an adapter with the `inbox-socket`
  // capability), where the CLI takes it. `delivered` false is not an error: the daemon types the doorbell instead.
  rpc DeliverNative(DeliverNativeRequest) returns (DeliverNativeResponse);
  // MeasureContext reads how big a conversation is from the CLI's own record. An adapter without it (one whose CLI
  // compacts itself) is never compacted by mesh.
  rpc MeasureContext(MeasureContextRequest) returns (MeasureContextResponse);
  // ReadTranscript reads a page of a conversation from the CLI's own record, for the chat view. An adapter without
  // it has no chat view (the daemon answers `supported: false`).
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse);
  // PlanCompact says how to compact a stopped conversation headless, before it is reopened.
  rpc PlanCompact(PlanCompactRequest) returns (PlanCompactResponse);
  // ListCommands lists the commands the CLI accepts at its prompt for an agent in `cwd`, for the composer's `/`
  // completion. An adapter without it has none (the daemon answers `supported: false`).
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // The kind agents name it by, such as "claude".
  string kind = 1;
  string display_name = 2;
  // CLI versions its decoding was verified against; others get a warning.
  repeated string verified_versions = 3;
  repeated string capabilities = 4;
}

message PlanLaunchRequest {
  string agent_id = 1;
  string agent_name = 2;
  string run_id = 3;
  agentmesh.v1.AgentRole role = 4;
  string cwd = 5;
  string model = 6;
  string effort = 7;
  // The CLI's binary, from the host's settings.
  string binary = 8;
  // The command every hook runs, as argv; the adapter appends its own arguments (the event name).
  repeated string hook_argv = 9;
  // The environment to start from: the daemon's allowlist plus the agent's identity.
  map<string, string> env = 10;
  // Start the CLI with its permission prompts off.
  bool skip_permissions = 11;
  // The repository's main checkout. An ASKER or REVIEWER (read-only) agent may not edit it or its worktree.
  string repo = 12;
  // Reopen this conversation instead of starting one (`claude --resume <id>`).
  string resume_session_id = 13;
  // Deny edits under cwd and repo, and publishing, whatever the role: a planner not yet approved. A read-only
  // role is denied either way.
  bool deny_edits = 14;
  // A lean session (Claude only): what it starts without. Unset, the CLI loads the user's full set.
  LeanLaunch lean = 15;
  // Open outside any run for the user's own terminal: resume the conversation without hooks, deny rules,
  // lean cuts, or skip-permissions flags.
  bool standalone = 16;
}

// LeanLaunch is the policy of a lean Claude session (design §11 of docs/design.md): tools, skills and plugins
// nothing in a mesh uses stay out of its first call, and only the MCP servers it needs load.
message LeanLaunch {
  // Tools denied by name (a bare name drops the tool's schema from every request), merged with the read-only
  // deny list.
  repeated string deny_tools = 1;
  // Skills hidden from the model's listing (the user can still type them).
  repeated string hidden_skills = 2;
  // Plugins turned off, by name (any marketplace): the ones the user's settings enable.
  repeated string off_plugins = 3;
  // Hide the skills synced from claude.ai.
  bool hide_claudeai_skills = 4;
  // A file of the MCP servers to load (Claude's `--mcp-config` format); only these load (`--strict-mcp-config`),
  // and claude.ai's connectors are off. Empty: the CLI loads every server the user's config has.
  string mcp_config_path = 5;
  // Pass `--system-prompt-snapshot off` on resume so tools added after the initial lean turn appear in requests.
  bool disable_prompt_snapshot = 6;
}

message WorktreeFile {
  // Relative path inside the worktree (must not escape it).
  string path = 1;
  bytes content = 2;
  // File mode (0600 by default when 0).
  uint32 mode = 3;
  // Keep the file out of git status: an untracked one is ignored (a self-ignoring .gitignore beside it, so other
  // checkouts of the repo are untouched; <git-common-dir>/info/exclude only at the worktree's top), and a tracked
  // one is marked skip-worktree.
  bool git_exclude = 4;
  // The content is a JSON object. When the repo tracks the path and its committed version is a JSON object too,
  // the file written is that version with the content's top-level keys added (replacing any of the same name),
  // so the repo's own entries stay in force. Unset, the committed version unreadable, or not the version one of
  // the repo's own refs has (a local non-mesh branch or an origin branch), the content replaces it.
  bool merge_tracked = 5;
}

message PlanLaunchResponse {
  repeated string argv = 1;
  map<string, string> env = 2;
  // The conversation id, when the adapter chose it up front.
  string session_id = 3;
  // Files the adapter needs in the agent's worktree before launch (for CLIs without inline `--settings` hooks).
  repeated WorktreeFile worktree_files = 4;
  // The conversation to resume (`resume_session_id`) does not exist: the adapter launched the same id fresh. Before
  // the agent's first turn nothing is lost; after one (`Agent.had_turn`) the context is gone and the agent is told.
  bool resume_missing = 5;
}

// LookupSessionRequest finds an agent's conversation by its worktree: the newest top-level one there. The first
// prompt (a doorbell) names neither the agent nor the run, so nothing else ties a conversation to it.
message LookupSessionRequest {
  reserved 2, 3;
  reserved "agent_name", "run_id";
  string agent_id = 1;
  string cwd = 4;
  string repo = 5;
  map<string, string> env = 6;
  // When the agent was created: a conversation started before it (or untouched since) is someone else's.
  google.protobuf.Timestamp not_before = 7;
}

message LookupSessionResponse {
  string session_id = 1;
}

message ReadInputBoxRequest {
  // A repaint as the terminal host sends it to a client with no screen (`Screen.Data`).
  bytes screen = 1;
  // The ref token of the doorbell to count above the box; empty counts none.
  string token = 2;
}

enum InputBox {
  INPUT_BOX_UNSPECIFIED = 0;
  // Nothing typed (ghost text such as a placeholder is not typed text).
  INPUT_BOX_EMPTY = 1;
  // Text is typed: ReadInputBoxResponse.text.
  INPUT_BOX_TYPED = 2;
  // No input box on the screen: a dialog, an alternate screen, a CLI still starting.
  INPUT_BOX_NONE = 3;
  // A box was found that can't be read.
  INPUT_BOX_UNCLEAR = 4;
}

message ReadInputBoxResponse {
  InputBox box = 1;
  // What is typed, whitespace squeezed (INPUT_BOX_TYPED).
  string text = 2;
  // Copies of the token above the input box (whitespace removed, so no wrap splits it).
  int32 token_above = 3;
  // Ghost text in an empty box: what the box shows dimmed (a placeholder, or Claude Code's suggested next prompt).
  // Set only where the adapter can tell a suggestion from its fixed hint; empty otherwise.
  string ghost = 4;
}

message ListCommandsRequest {
  // The agent's worktree and environment (where the CLI keeps its config), and the CLI's binary.
  string cwd = 1;
  map<string, string> env = 2;
  string binary = 3;
  // A read-only agent (an asker or a reviewer) may sit on a PR head nobody trusted: the CLI then reads only the
  // user's own settings.
  bool read_only = 4;
  // What the agent's launch leaves out of its CLI (the plugins turned off, the claude.ai skills): the list is the one
  // the launched CLI has. Only its `off_plugins` and `hide_claudeai_skills` are read.
  LeanLaunch lean = 5;
}

message ListCommandsResponse {
  repeated agentmesh.v1.AgentCommand commands = 1;
}

message DeliverNativeRequest {
  string agent_id = 1;
  // The terminal's process and when it started (clock ticks since boot), which the CLI's own record of itself must
  // match: a process that reused the pid is not the agent.
  int64 pid = 2;
  uint64 pid_start_ticks = 3;
  string cwd = 4;
  // The agent's environment: where the CLI keeps its records (its config folder).
  map<string, string> env = 5;
  // The doorbell, as it would be typed.
  string text = 6;
}

message DeliverNativeResponse {
  bool delivered = 1;
  // Why not, for the log and the apps: no record of the process, no socket, a setting that holds messages, a failed
  // write.
  string reason = 2;
}

message DescribeModelRequest {
  string model = 1;
}

message DescribeModelResponse {
  // The effort the model's name fixes (an agy id such as `gemini-4-neon-low`), or empty.
  string effort = 1;
}

message MeasureContextRequest {
  string session_id = 1;
  string cwd = 2;
  // The environment the CLI's records are found by (HOME).
  map<string, string> env = 3;
}

message MeasureContextResponse {
  agentmesh.v1.ContextUsage usage = 1;
}

message ReadTranscriptRequest {
  string session_id = 1;
  string cwd = 2;
  // The environment the CLI's records are found by (HOME, its config dir).
  map<string, string> env = 3;
  // As agentmesh.v1.ReadTranscriptRequest.
  int64 offset = 4;
  bool backward = 5;
  int64 max_bytes = 6;
}

message ReadTranscriptResponse {
  repeated agentmesh.v1.TranscriptEntry entries = 1;
  int64 start_offset = 2;
  int64 end_offset = 3;
  bool at_start = 4;
}

message PlanCompactRequest {
  string binary = 1;
  string session_id = 2;
  string cwd = 3;
  map<string, string> env = 4;
  string model = 5;
  string effort = 6;
  // What the compaction keeps.
  string focus = 7;
  // The agent's lean session policy (Claude), so the compaction loads no more than the agent did.
  LeanLaunch lean = 8;
  // Tools denied by name, as at launch (a read-only agent's).
  repeated string deny_tools = 9;
}

message PlanCompactResponse {
  repeated string argv = 1;
  map<string, string> env = 2;
}

message DecodeHookRequest {
  string agent_id = 1;
  // The conversation id the daemon knows for the agent; hooks from another conversation are dropped.
  string session_id = 2;
  string event_name = 3;
  bytes payload = 4;
  google.protobuf.Timestamp fired_at = 5;
}

message DecodeHookResponse {
  repeated AgentEvent events = 1;
}

// AgentEvent is a neutral event an adapter derives from a hook, a stream or the process. One pure reducer turns
// a sequence of them into the agent's state.
message AgentEvent {
  google.protobuf.Timestamp time = 1;
  oneof kind {
    SessionStarted session_started = 10;
    TurnStarted turn_started = 11;
    Activity activity = 12;
    NeedsInput needs_input = 13;
    TurnEnded turn_ended = 14;
    Compacting compacting = 15;
    SessionEnded session_ended = 16;
    ProcessExited process_exited = 17;
    DecodeError decode_error = 18;
    RateLimited rate_limited = 19;
    TurnFailed turn_failed = 20;
  }
}

// The CLI is up and idle at its prompt (also after /clear or a resume).
message SessionStarted {
  string session_id = 1;
  // "startup", "resume", "clear", "compact".
  string source = 2;
}

message TurnStarted {
  // The turn began with a mesh doorbell (`📬 [mesh]`), not text the user typed. False when unknown.
  bool by_mesh = 1;
}

// Something happened in a turn (a tool ran); keeps the agent from reading as unknown.
message Activity {
  string detail = 1;
}

// The CLI waits on the user: a permission prompt, a question.
message NeedsInput {
  string reason = 1;
}

message TurnEnded {}

message Compacting {}

message SessionEnded {
  string reason = 1;
}

message ProcessExited {
  int32 exit_code = 1;
  int32 signal = 2;
}

message DecodeError {
  string error = 1;
}

// The CLI hit a quota or rate limit (RESOURCE_EXHAUSTED 429, usage limit); ready for SwitchAgent.
message RateLimited {
  string message = 1;
  string reset_in = 2;
  // When the limit is over, if the CLI said (Claude's "resets 3pm (America/Sao_Paulo)").
  google.protobuf.Timestamp reset_at = 3;
  // The limit is on the whole account (a session or weekly limit), so every model of a chain shares it: no
  // other model of the chain is free. False for a limit on one model (agy's, Claude's Opus or Sonnet limit).
  bool all_models = 4;
}

// The turn ended in a non-limit error.
message TurnFailed {
  string error = 1;
}
