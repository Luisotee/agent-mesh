syntax = "proto3";

package agentmesh.v1;

import "agentmesh/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Asks: a question for a read-only agent, a PR review by one or several reviewers, collected into one answers
// file and one message to the caller (`mesh ask`, `mesh verdict`, `mesh asks`).

enum AskKind {
  ASK_KIND_UNSPECIFIED = 0;
  // A question; collected only when it goes to several agents at once.
  ASK_KIND_QUESTION = 1;
  // A review of one commit of a pull request: a round of reviewers, or one.
  ASK_KIND_REVIEW = 2;
  // A question for standing peers (`mesh ask --peers`): one answers file, one message.
  ASK_KIND_PEERS = 3;
}

enum AskStatus {
  ASK_STATUS_UNSPECIFIED = 0;
  // Members are still to answer.
  ASK_STATUS_OPEN = 1;
  // Every member answered or was settled; the caller was told once.
  ASK_STATUS_FINISHED = 2;
}

enum AskMemberStatus {
  ASK_MEMBER_STATUS_UNSPECIFIED = 0;
  ASK_MEMBER_STATUS_PENDING = 1;
  // It sent a `done`.
  ASK_MEMBER_STATUS_ANSWERED = 2;
  // It will not answer in this ask: a `failed`, a question back, an exit or silence the daemon told the caller of,
  // or the deadline.
  ASK_MEMBER_STATUS_SETTLED = 3;
  // Not asked: its kind is not installed, or it was skipped; `line` says why.
  ASK_MEMBER_STATUS_NOT_ASKED = 4;
}

// AskMember is one agent an ask is waiting on.
message AskMember {
  string agent_id = 1;
  string name = 2;
  // The CLI kind ("claude", "agy").
  string kind = 3;
  // "fresh" (started for this ask), "asked" (a live agent of this run given a new task) or "resumed" (a retired
  // one brought back).
  string how = 4;
  AskMemberStatus status = 5;
  // What settled it, or why it was not asked: one line.
  string line = 6;
  // The answer: the body of its `done` (or `failed`).
  string text = 7;
  // The type it settled with: "done", "failed", "question", "plan" or an alert kind.
  string type = 8;
  string model = 9;
  string tier = 10;
  // The commit this agent reviewed at (a review), or a peer's checkout when it was asked.
  string head = 11;
  // A peer: its clone, how many upstream commits came since it was last asked, and what it is for.
  string peer_repo = 12;
  int32 upstream_new = 13;
  string about = 14;
}

// Verdict is the root's judgement of one reviewer's findings on a round (`mesh verdict`).
message Verdict {
  string reviewer = 1;
  string kind = 2;
  string model = 3;
  // The tier it ran on (the execution tier when it was executing).
  string tier = 4;
  int32 agree = 5;
  int32 other = 6;
  int32 disagree = 7;
  // Of the findings agreed with or otherwise useful, how many were blocking.
  int32 blocking = 8;
  google.protobuf.Timestamp at = 9;
}

// Ask is the record of one `mesh ask` that started or reached agents.
message Ask {
  string id = 1;
  string run_id = 2;
  // The agent that asked, and that every member reports to.
  string caller_id = 3;
  string caller_name = 4;
  AskKind kind = 5;
  AskStatus status = 6;
  // A review: the pull request's URL and number, its repo (the checkout's top level), the commit under review
  // and, for a re-review, the commit the last review covered.
  string pr = 7;
  int32 pr_number = 8;
  string repo = 9;
  string head = 10;
  string since = 11;
  // trivial, small or large: picks the slots, the /code-review level and the round ceiling.
  string size = 12;
  string tier = 13;
  // The question, or the notes to the reviewers.
  string body = 14;
  repeated AskMember members = 15;
  // Whether the daemon holds the members' answers and writes them into one file (a round); false for one
  // agent, whose own `done` is already one wake.
  bool collected = 16;
  // The file the answers go into (fixed at the start; it exists once the ask is finished).
  string answers_path = 17;
  // Which round of this PR this is (1 for the first), counted across runs.
  int32 round = 18;
  repeated Verdict verdicts = 19;
  // After it, members still pending are settled as not answered.
  google.protobuf.Timestamp deadline = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp finished_at = 22;
  // The ask is still starting its members: it can't finish yet, however many have answered.
  bool starting = 23;
  // What the answers file says before the question: the peers' groups' `about`.
  string context = 24;
}

message AskRequest {
  RequestMeta meta = 1;
  // An existing agent of this run, by name, to ask or to ask again (it is resumed if retired). Without it, a
  // fresh agent is started in `repo`.
  string agent = 2;
  // The git repository a fresh asker or reviewer works in.
  string repo = 3;
  // The question, or the notes to the reviewers; `@file` reads it from a file.
  string body = 4;
  // A pull request to review (its URL or number in `repo`): the ask is a review, of the PR's head commit.
  string review = 5;
  // trivial, small or large: the review's slots (`review.reviewers.<size>`), /code-review level and rounds.
  string size = 6;
  string tier = 7;
  // The CLI of a fresh agent; a round chooses its own.
  string kind = 8;
  string model = 9;
  string effort = 10;
  // A round: "auto" (the size's slots, the author's CLI last, a re-review as `review.re_review.*` says), "all"
  // (every installed CLI) or a comma list of kinds. Needs `repo`, `review`, `size` and `tier`.
  string reviewers = 11;
  // Review only what changed since this commit, the head the last review covered.
  string since = 12;
  // Names a fresh agent (<repo>-<slug>); default: from the body.
  string slug = 13;
  // Standing peers to ask, all at once: "all", a group, or a comma list of peer names and groups. Needs `tier`
  // and `body`; collected into one answers file.
  string peers = 14;
  // Ask the peers as they are: don't fetch their upstream or move their checkout.
  bool no_refresh = 15;
  // Seconds a collected ask waits for its members, instead of `ask.timeout`.
  int32 timeout = 16;
}

message AskResponse {
  // The ask's record, when it is kept (a round, or one reviewer).
  Ask ask = 1;
  // The agents started or reached, in the order of the ask's members; for a plain question, the one agent.
  repeated Agent agents = 2;
  // What the caller should know: a busy agent, a kind skipped, a worktree that stayed on an old commit.
  repeated string notes = 3;
  // The rounds hint, for a review.
  string hint = 4;
  // The message that carried the task, for an existing agent.
  Message message = 5;
}

message RecordVerdictRequest {
  RequestMeta meta = 1;
  // The pull request (URL or number) of the round.
  string pr = 2;
  // The reviewer, by name.
  string reviewer = 3;
  int32 agree = 4;
  int32 other = 5;
  int32 disagree = 6;
  int32 blocking = 7;
}

message RecordVerdictResponse {
  Ask ask = 1;
  Verdict verdict = 2;
}

message ListAsksRequest {
  // Empty means the caller's own run (every run for a device).
  string run_id = 1;
  // Only the asks of this pull request (URL or number).
  string pr = 2;
  bool open_only = 3;
}

message ListAsksResponse {
  repeated Ask asks = 1;
}

// ── peers ──

// PeerUpstream is where a peer's project lives on the network.
message PeerUpstream {
  string remote = 1;
  string branch = 2;
  string url = 3;
}

// Peer is a standing read-only asker for a cloned project: it keeps its conversation across runs (each run that
// asks it gets its own agent record that resumes it) and its own detached worktree of the clone.
message Peer {
  // `<repo>-research` (the repo part cut to 20 characters), unique on the host.
  string name = 1;
  // The clone.
  string repo = 2;
  string group = 3;
  // The CLI it runs on.
  string kind = 4;
  // What it is and what to ask it, at most 400 characters.
  string about = 5;
  PeerUpstream upstream = 6;
  // Its own detached worktree of the clone, where its agent works; never removed by StopRun.
  string worktree = 7;
  // The commit it last looked at.
  string seen = 8;
  // Its conversation, once it has been asked; empty means never briefed.
  string session_id = 9;
  google.protobuf.Timestamp added = 10;
  google.protobuf.Timestamp asked = 11;
  // The run and agent that last asked it, and the answers file of the last `ask --peers` it answered.
  string last_run = 12;
  string last_agent = 13;
  string last_answers = 14;
  // The run and agent that hold its conversation running now; empty when none does.
  string running_run = 15;
  string running_agent = 16;
}

message PeerGroup {
  string name = 1;
  string about = 2;
}

message ListPeersRequest {
  // Only the peers of this group.
  string group = 1;
}

message ListPeersResponse {
  repeated Peer peers = 1;
  repeated PeerGroup groups = 2;
}

message AddPeerRequest {
  RequestMeta meta = 1;
  // A git URL (cloned into `peers.dir`/<group>/<repo>) or the path of a clone that exists.
  string source = 2;
  string group = 3;
  string about = 4;
  // Default `<repo>-research`.
  string name = 5;
  // The CLI its asker runs on (default claude).
  string kind = 6;
}

message AddPeerResponse {
  Peer peer = 1;
}

message EditPeerRequest {
  RequestMeta meta = 1;
  // A peer's name or a group's: the `about` of that one is replaced.
  string target = 2;
  string about = 3;
}

message EditPeerResponse {
  Peer peer = 1;
  PeerGroup group = 2;
}

message RemovePeerRequest {
  RequestMeta meta = 1;
  string name = 2;
  // Also delete the clone, when the daemon cloned it.
  bool delete_clone = 3;
}

message RemovePeerResponse {
  string worktree = 1;
}

message ImportPeersRequest {
  RequestMeta meta = 1;
  // bin/mesh's peers.json; default `~/.local/state/agent-mesh/peers.json`. It is only read.
  string from = 2;
}

message ImportPeersResponse {
  repeated string imported = 1;
  // Peers and groups left alone, with why.
  repeated string skipped = 2;
}
