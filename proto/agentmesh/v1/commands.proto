syntax = "proto3";

package agentmesh.v1;

import "agentmesh/v1/options.proto";
import "agentmesh/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Standalone run worktrees (`mesh worktree`), event timeline (`mesh log`), manual doorbell (`mesh ring`), and
// opening a live or past agent (`mesh open`).

message CreateWorktreeRequest {
  RequestMeta meta = 1;
  // Defaults to the caller's own run for a root; required for a device.
  string run_id = 2;
  // Path to the git repository.
  string repo = 3 [(path) = true];
  // Names the branch (mesh/<run>/<slug>) and the worktree directory (<repo>-<slug>).
  string slug = 4;
  // Branch or commit to start from; empty uses origin/HEAD, else HEAD.
  string base = 5;
}

message CreateWorktreeResponse {
  Worktree worktree = 1;
}

message StreamLogRequest {
  // Run id to inspect (defaults to the caller's own run; required for a device unless `agent` names one).
  string run_id = 1;
  // Only entries involving this agent (id or name).
  string agent = 2;
  // Print only the last N matching entries (0 prints all).
  int32 lines = 3;
  // Keep streaming new entries until the run stops.
  bool follow = 4;
}

message LogEntry {
  int64 seq = 1;
  google.protobuf.Timestamp time = 2;
  string kind = 3;
  string who = 4;
  string detail = 5;
  string run_id = 6;
  string agent_id = 7;
}

message StreamLogResponse {
  LogEntry entry = 1;
}

message RingAgentRequest {
  RequestMeta meta = 1;
  // Agent id or name to re-ring.
  string agent = 2;
}

message RingAgentResponse {
  Agent agent = 1;
  int32 unread = 2;
  bool rung = 3;
  // "socket" or "pty" when rung; empty otherwise.
  string via = 4;
  // Why the doorbell was not rung (e.g. "human_draft", "busy", "stopped").
  string error = 5;
}

enum OpenMode {
  OPEN_MODE_UNSPECIFIED = 0;
  // Attach to the running agent's terminal stream in mesh-term.
  OPEN_MODE_ATTACH = 1;
  // Reopen the stopped agent's conversation in the caller's own terminal.
  OPEN_MODE_EXEC = 2;
}

message OpenAgentRequest {
  // Agent id, name, or branch (`mesh agents` lists them).
  string agent = 1;
  // Look only in this run (default: newest match across runs).
  string run_id = 2;
  // Override the model it ran on (stopped agents only).
  string model = 3;
  // Override the effort (stopped agents only).
  string effort = 4;
  // Extra CLI arguments passed after `--` (stopped agents only).
  repeated string extra_args = 5;
}

message OpenAgentResponse {
  Agent agent = 1;
  OpenMode mode = 2;
  // For OPEN_MODE_ATTACH: WebSocket path on the daemon's listener, ticket included (with input=true).
  string terminal_path = 3;
  // For OPEN_MODE_EXEC: command line, environment overrides, working directory, branch and notes.
  repeated string argv = 4;
  map<string, string> env = 5;
  string cwd = 6;
  string branch = 7;
  bool worktree_recreated = 8;
  repeated string notes = 9;
}
