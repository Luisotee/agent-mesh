syntax = "proto3";

package agentmesh.v1;

import "agentmesh/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Reporting: tokens (the main measure) and API-equivalent dollars per agent/kind/model/phase and reviewer verdicts (`mesh cost`), new and retired model
// families (`mesh models`), and branch conflicts and file overlaps (`mesh conflicts`).

message GetCostRequest {
  // Run id to measure (defaults to the caller's run unless --since or --until is given).
  string run_id = 1;
  // Window start: a span back from now (7d, 36h, 90m) or ISO 8601 (local time when no offset is given).
  string since = 2;
  // Window end (default: now).
  string until = 3;
  // Include the per-agent table in window mode too.
  bool agents = 4;
}

message AgentCost {
  string run = 1;
  string name = 2;
  string kind = 3;
  int64 calls = 4;
  int64 input = 5;
  int64 w1 = 6;
  int64 w5 = 7;
  int64 read = 8;
  int64 output = 9;
  double usd = 10;
  double plan_usd = 11;
  double exec_usd = 12;
  double sub_usd = 13;
  int64 cold = 14;
  double cold_usd = 15;
  // input + cache writes (w1 + w5) + output: what the agent worked through. Cache reads (read) are left out: they are
  // most of a Claude session's tokens but cost a plan far less.
  int64 total = 16;
}

message KindCost {
  string kind = 1;
  int64 sessions = 2;
  int64 calls = 3;
  double usd = 4;
  double share = 5;
  double usd_per_call = 6;
  int64 ctx_per_call = 7;
  int64 out_per_call = 8;
  int64 input = 9;
  int64 w1 = 10;
  int64 w5 = 11;
  int64 read = 12;
  int64 output = 13;
  double write_5m_share = 14;
  int64 first_ctx_median = 15;
  bool has_first_ctx_median = 16;
  int64 cold = 17;
  double cold_usd = 18;
  // input + w1 + w5 + output, as AgentCost.total.
  int64 total = 19;
  // This kind's percent of the tokens counted in total (`share` is the percent of the dollars).
  double token_share = 20;
}

// Deprecated: GetCostResponse.kinds now carries agy and OpenCode as well; this list is no longer filled.
message TokenKindCost {
  string kind = 1;
  int64 sessions = 2;
  int64 calls = 3;
  int64 input = 4;
  int64 read = 5;
  int64 output = 6;
  // Non-zero when a tokens-only CLI (such as a paid OpenCode provider) reports its own dollar cost.
  double usd = 7;
}

message ModelPhaseCost {
  string model = 1;
  string phase = 2;
  int64 calls = 3;
  double usd = 4;
  int64 ctx_per_call = 5;
  int64 out_per_call = 6;
  int64 input = 7;
  int64 w1 = 8;
  int64 w5 = 9;
  int64 read = 10;
  int64 output = 11;
  // input + w1 + w5 + output, as AgentCost.total.
  int64 total = 12;
}

// Deprecated: GetCostResponse.by_model now carries agy and OpenCode as well; this list is no longer filled.
message TokenModelPhaseCost {
  string model = 1;
  string phase = 2;
  int64 calls = 3;
  int64 input = 4;
  int64 read = 5;
  int64 output = 6;
  double usd = 7;
}

message ReviewCostSummary {
  int64 prs = 1;
  double usd = 2;
  double usd_per_pr = 3;
  bool has_usd_per_pr = 4;
  int64 reviewed_prs = 5;
  double reviewers_per_pr = 6;
  bool has_reviewers_per_pr = 7;
  map<string, double> by_cli = 8;
}

message VerdictCostSummary {
  string kind = 1;
  string model = 2;
  string tier = 3;
  int64 reviews = 4;
  int64 agree = 5;
  int64 other = 6;
  int64 disagree = 7;
  int64 blocking = 8;
  int64 findings = 9;
  int32 agreed_pct = 10;
  bool has_agreed_pct = 11;
  // Of `reviews`, how many carry the PR author's verdict (a worker's), not the root's.
  int64 by_author = 12;
}

// One CLI's tokens in the measured span, and how far to trust them.
message CliCost {
  // claude, agy or opencode.
  string cli = 1;
  int64 calls = 2;
  int64 input = 3;
  int64 w1 = 4;
  int64 w5 = 5;
  int64 read = 6;
  int64 output = 7;
  // input + w1 + w5 + output, as AgentCost.total.
  int64 total = 8;
  // Exact or an estimate, and why (what the CLI records).
  string basis = 9;
  // Claude: its API-equivalent price. OpenCode: what the provider reported (zero for a free model). agy: none. Only
  // here do an OpenCode provider's dollars appear: the rows and the response's usd are Claude's priced dollars.
  double usd = 10;
}

message GetCostResponse {
  string scope = 1;
  string prices_as_of = 2;
  // What the Claude sessions would cost at API prices (a plan is billed otherwise): context beside the tokens, not the
  // measure. Every row's usd is Claude's too; agy and OpenCode have no price here (see CliCost.usd).
  double usd = 3;
  repeated AgentCost agents = 4;
  repeated KindCost kinds = 5;
  repeated TokenKindCost token_kinds = 6;
  repeated ModelPhaseCost by_model = 7;
  repeated TokenModelPhaseCost tokens_by_model = 8;
  ReviewCostSummary reviews = 9;
  repeated VerdictCostSummary verdicts = 10;
  int32 resets = 11;
  // The main figure: input + cache writes + output over every CLI (total of the rows). Cache reads are in total_read.
  int64 total_tokens = 12;
  int64 total_read = 13;
  // Per CLI, tokens first, with how exact each is.
  repeated CliCost clis = 14;
}

message CheckModelsRequest {
  RequestMeta meta = 1;
  // List again now (default: reuse a result up to a day old).
  bool check = 2;
  // A family decided on (<kind>:<name>, e.g. agy:neon): no longer reported as new.
  repeated string ack = 3;
}

message ModelFamilyEntry {
  string family = 1;
  bool in_tiers = 2;
}

message KindModels {
  string kind = 1;
  repeated ModelFamilyEntry listed = 2;
  repeated string new_families = 3;
  repeated string retired_families = 4;
  repeated string acked_families = 5;
}

message CheckModelsResponse {
  google.protobuf.Timestamp checked_at = 1;
  repeated KindModels kinds = 2;
  // One-line notice when new or retired models exist; empty when nothing changed.
  string notice = 3;
}

message ResolveModelRequest {
  // The CLI adapter; default claude.
  string kind = 1;
  // The tier (tiers.<kind>.<tier>): required unless a model is named.
  string tier = 2;
  // A model the user named, used as it is.
  string model = 3;
  // Overrides the tier's effort (a named model defaults to its own, else the tier's, else high).
  string effort = 4;
}

message ChainModel {
  string model = 1;
  // Empty when it has quota; else why a spawn would skip it: "held until 17:40", "at the reserve (6% left)".
  string standing = 2;
}

message ResolveModelResponse {
  string kind = 1;
  string tier = 2;
  // What a spawn would launch on.
  string model = 3;
  string effort = 4;
  // The tier's chain, first choice first (OpenCode's `free` expanded); empty for a named model.
  repeated ChainModel chain = 5;
}

message CheckConflictsRequest {
  // Run id to check (defaults to the caller's own run; required for a device).
  string run_id = 1;
}

enum ConflictKind {
  CONFLICT_KIND_UNSPECIFIED = 0;
  CONFLICT_KIND_CONFLICT = 1;
  CONFLICT_KIND_OVERLAP = 2;
}

message BranchConflict {
  string repo = 1;
  string branch = 2;
  string against = 3;
  repeated string files = 4;
  ConflictKind kind = 5;
}

message CheckConflictsResponse {
  int32 checked_branches = 1;
  repeated BranchConflict conflicts = 2;
  repeated BranchConflict overlaps = 3;
  repeated string warnings = 4;
}
