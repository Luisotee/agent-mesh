syntax = "proto3";

package agentmesh.v1;

import "agentmesh/v1/actor.proto";
import "agentmesh/v1/ask.proto";
import "agentmesh/v1/chat.proto";
import "agentmesh/v1/commands.proto";
import "agentmesh/v1/context.proto";
import "agentmesh/v1/options.proto";
import "agentmesh/v1/pr.proto";
import "agentmesh/v1/report.proto";
import "agentmesh/v1/tools.proto";
import "agentmesh/v1/types.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// MeshService is the host's action registry: every action the apps, the CLI and the agents can take. Each RPC
// names the actor classes allowed to call it; the caller's class comes from its token.
service MeshService {
  option (permissions) = {
    name: "terminal.input"
    actors: [ACTOR_CLASS_DEVICE]
  };

  // The handshake: who the daemon is and what it supports. A connection is ready once this answers.
  rpc Hello(HelloRequest) returns (HelloResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      summary: "Show the daemon's id, version and capabilities, and who you are to it"
    };
  }

  rpc StartRun(StartRunRequest) returns (StartRunResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      summary: "Start a run"
    };
  }

  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      summary: "List runs"
    };
  }

  // Start an agent in a repo's new worktree. A device starts any role, a root workers and read-only agents, a
  // worker only read-only agents (askers, reviewers).
  rpc SpawnAgent(SpawnAgentRequest) returns (SpawnAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "spawn"
      summary: "Start an agent in a new worktree of a repo"
    };
  }

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "agents"
      summary: "List agents with their state"
    };
  }

  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "agent"
      summary: "Show one agent"
    };
  }

  // Stop an agent's process (its whole process group). A device stops any agent, an agent only its children.
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "stop"
      summary: "Stop an agent"
    };
  }
  // Approve an agent's plan: store the answer and move it to its execution tier (or model) by reopening its own
  // conversation without the planning deny list. Only its parent or a device, and only when its newest report
  // since its last task or answer is a plan.
  rpc ApproveAgent(ApproveAgentRequest) returns (ApproveAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "approve"
      summary: "Approve an agent's plan and move it to its execution tier"
    };
  }

  // Move an agent to another tier, model or effort, or to the next model of its chain (a quota), by reopening
  // its own conversation. A move asked for mid-turn runs at its next IDLE.
  rpc SwitchAgent(SwitchAgentRequest) returns (SwitchAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "switch"
      summary: "Move an agent to another model, keeping its conversation"
    };
  }

  // Reopen a stopped agent's conversation, with a new task or as it was.
  rpc ResumeAgent(ResumeAgentRequest) returns (ResumeAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "resume"
      summary: "Resume a stopped agent's conversation"
    };
  }


  // Stop an agent's process on purpose and keep its conversation: RETIRED, its token revoked, its worktree and
  // branch kept. A message to it, or ResumeAgent, brings it back. Its parent or a device.
  rpc RetireAgent(RetireAgentRequest) returns (RetireAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "retire"
      summary: "Retire an agent: stop its process, keep its conversation"
    };
  }

  // Change a run's title. A root may rename its own run; a device any.
  rpc RenameRun(RenameRunRequest) returns (RenameRunResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "rename-run"
      summary: "Change a run's title"
    };
  }

  // Ask the user's app to show a view (an agent's chat or terminal, the settings, a run): sent to the apps connected now,
  // which show it as a toast the user opens or dismisses (and switch by themselves only when the user turned `app.open_views` on).
  // An agent may ask once in 10 seconds.
  rpc OpenView(OpenViewRequest) returns (OpenViewResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "open-view"
      summary: "Ask the user's app to show a view (an agent's chat or terminal, settings, a run)"
    };
  }

  // Stop a run: retire every agent in it and close it. A clean worktree is removed, and its branch with it unless
  // it moved past the commit it started at, or was pushed; a worktree with uncommitted changes stays.
  rpc StopRun(StopRunRequest) returns (StopRunResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "stop-run"
      summary: "Stop a run: retire its agents and close it"
    };
  }

  // Store a message for an agent and ring its doorbell. An agent sends only to its parent or its children.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "send"
      summary: "Send a message to an agent"
    };
  }

  // The calling agent's messages; unread ones are marked read unless peek is set.
  rpc ReadInbox(ReadInboxRequest) returns (ReadInboxResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER
      ]
      write: true
      cli: "inbox"
      summary: "Read your messages"
    };
  }

  // Make a running Claude Code session the run's root, in place: the session keeps its terminal, and its `mesh`
  // calls act as the root. The run's own root, when it has one, is retired and this session takes its place (its
  // id, name, mailbox and workers). Needs the session to take cross-session frames (`crossSessionInbound`
  // accept in the user's own Claude settings: mesh never edits them). `mesh adopt` fills `pid` from the session
  // it runs in.
  rpc AdoptSession(AdoptSessionRequest) returns (AdoptSessionResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "adopt"
      summary: "Make this Claude Code session the run's root"
    };
  }

  // A change worker's work at a glance: its branch's commits past the base, the diff stat, whether the tip is
  // pushed and the worktree clean, and its PRs with their checks (read from GitHub now). One call for what the
  // root otherwise fetches, diffs and lists by hand.
  rpc CheckAgent(CheckAgentRequest) returns (CheckAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "check"
      summary: "Check a worker's branch, diff and PR"
    };
  }

  // The stored messages of a run, oldest first, for a device or a root to read (ReadInbox is an agent's own
  // mailbox). A page ends at `limit`; `more` says there are further messages after the last one, whose id is
  // the next page's `after_id`.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "messages"
      summary: "List the messages of a run"
    };
  }

  // What waits on the user (what `bin/mesh status` calls waiting rows, for a person): a plan or a question sent
  // to an open run's lead that nobody has answered since, from an agent that is still there to hear the answer,
  // and every agent stopped at a prompt in its terminal. Oldest first, plans and questions before prompts. A
  // lead reads its own run's.
  rpc ListWaiting(ListWaitingRequest) returns (ListWaitingResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "waiting"
      summary: "List what waits on the user"
    };
  }

  // The event log from a cursor, then live. The first message is a Snapshot or a Resumed; only an End message
  // ends the stream, so a client resumes from its cursor after any other close.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "events"
      summary: "Follow the event log"
    };
  }

  // The host's settings (the policy: tiers, reviewers, caps, …) with their defaults and schemas, every one whose
  // key starts with the prefix. Agents read the policy they run under.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "settings"
      summary: "List settings"
    };
  }

  // Set a setting. The value must fit its schema; a key no setting has is NotFound.
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "set"
      summary: "Set a setting"
    };
  }

  // Carry bin/mesh's policy file (`~/.config/agent-mesh.json`) over: each leaf it names that this host has (or
  // maps: `repos_dir`, `peers_dir`, `copilot_model`) is stored as a setting, except one already set unless
  // `overwrite`. The file is only read; a key that can't be imported is reported and skipped.
  rpc ImportSettings(ImportSettingsRequest) returns (ImportSettingsResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "import-settings"
      summary: "Import bin/mesh's policy file (agent-mesh.json) into the settings (read only)"
    };
  }

  // Put a setting back to its default.
  rpc ResetSetting(ResetSettingRequest) returns (ResetSettingResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "unset"
      summary: "Reset a setting to its default"
    };
  }

  // Reset the root's context (`mesh reset`): at a quiet prompt it relaunches lean or `/clear`s, then rings the
  // bootstrap text. Acts on the caller's own run's root.
  rpc ResetRoot(ResetRootRequest) returns (ResetRootResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "reset"
      summary: "Reset the root's context: a fresh session that rebuilds from its notes"
    };
  }

  // Each change worker's pull requests with their state and checks, read from GitHub (cached two minutes), and
  // the work evidence (commits, pushed, dirty) of a worker with none.
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "prs"
      summary: "List each change worker's pull requests with state and checks (and its work evidence when it has none)"
    };
  }

  // Hold a pull request's merge, or release it: a root never merges a held PR (ORCHESTRATE). The hold is the user's
  // brake on one PR, at any autonomy level; it is kept by the PR's url (outliving every record of it) and shown by
  // ListPullRequests. A root may hold a PR of its own run, and may not release one: only the user does.
  rpc HoldPullRequest(HoldPullRequestRequest) returns (HoldPullRequestResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "hold-pr"
      summary: "Hold a pull request's merge (or release it): a root never merges a held one"
    };
  }

  // The repositories this host can start work in: the git folders under the `repos.dir` folders and every repo
  // an agent has worked in, each with its default branch and branches; with `repo` set, that one with its open
  // pull requests (read from GitHub) too.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "projects"
      summary: "List the repos this host can start work in, with their default branch and open pull requests"
    };
  }

  // What a root (or any agent) needs to rebuild its picture of the run: the root card, notes, status, unread mail
  // headers and the last reset. Marks nothing read.
  rpc GetBrief(GetBriefRequest) returns (GetBriefResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "brief"
      summary: "Print the run's brief: the root card, notes, status and unread mail headers"
    };
  }

  // A hook of the calling agent's CLI fired. Called by `mesh hook`, never by hand.
  rpc ReportHook(ReportHookRequest) returns (ReportHookResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER
      ]
      write: true
      summary: "Report a CLI hook (used by the hook command)"
    };
  }

  // A one-time ticket for an agent's terminal WebSocket. Input is granted only with the terminal.input right.
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      summary: "Get a ticket for an agent's terminal stream"
    };
  }

  // Start a plain login shell in a project's folder, on the host's terminal host (it survives an app restart and a
  // daemon restart). Not an agent: no run, no row, no confinement. Needs the `terminal.input` right, and a project the
  // host knows (a folder of `repos.dir`, or a repo an agent worked in: what `ListProjects` draws on).
  rpc OpenShell(OpenShellRequest) returns (OpenShellResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "open-shell"
      summary: "Start a shell in a project's folder on the host"
    };
  }

  // The shells that are running (or exited and not yet seen to), oldest first.
  rpc ListShells(ListShellsRequest) returns (ListShellsResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE, ACTOR_CLASS_READ_ONLY_DEVICE]
      cli: "shells"
      summary: "List the host's project shells"
    };
  }

  // End a shell: SIGHUP, as closing a terminal window does (the shell passes it to its background jobs), then SIGTERM and SIGKILL after 3 s if it is still there; the host forgets it. A ticket already issued for it stops working.
  rpc CloseShell(CloseShellRequest) returns (CloseShellResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "close-shell"
      summary: "End a project shell"
    };
  }

  // An agent's conversation as its CLI recorded it, for the chat view: the prompts, replies and tool calls, a page at
  // a time. Only for a CLI whose record the adapter can read (Claude Code); others answer `supported: false`.
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "transcript"
      summary: "Show an agent's conversation as its CLI recorded it"
    };
  }

  // Type a prompt into the agent's running CLI, as the user would in its terminal (the chat view's composer). Never
  // a second process on the conversation, and never a mesh message: it is the user's own words, so only a device
  // with the terminal.input right may. Typed at once when the agent is at its prompt with an empty input box; else
  // queued (the answer's `queued`) and typed at its next idle. Refused only for an agent with no terminal.
  rpc PromptAgent(PromptAgentRequest) returns (PromptAgentResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "prompt"
      summary: "Type a prompt into an agent's terminal as the user (queued while it can't take one)"
    };
  }

  // The prompts the user sent an agent that wait to be typed: sent while it worked, started, waited at a prompt or had
  // a draft in its box (`PromptAgent` queues them), typed one at a time at its next idle, oldest first.
  rpc ListPrompts(ListPromptsRequest) returns (ListPromptsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "prompts"
      summary: "List the prompts waiting to be typed into an agent"
    };
  }

  // Take back a queued prompt before it is typed (the chat's Up arrow): the prompt is returned, to edit or drop. Refused
  // once the daemon has started typing it, so a prompt is either withdrawn or typed, never both.
  rpc WithdrawPrompt(WithdrawPromptRequest) returns (WithdrawPromptResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "withdraw-prompt"
      summary: "Take back a prompt that waits to be typed into an agent"
    };
  }

  // Type a queued prompt now although the agent's input box holds a draft (its `held` is "draft"): clears the box, as Ctrl-U
  // does, and types the prompt. For a draft the caller was shown (`QueuedPrompt.held_text`) and confirmed to discard: refused
  // when the box holds anything else by now, when someone is typing in the terminal, or when the agent is not at its prompt.
  rpc SendPromptAnyway(SendPromptAnywayRequest) returns (SendPromptAnywayResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "send-prompt-anyway"
      summary: "Type a held prompt now, clearing the draft in the agent's input box"
    };
  }

  // Interrupt an agent's turn, as Esc does in its terminal: the CLI stops what it is doing and waits for a prompt. Only
  // for a CLI whose interrupt key the adapter knows. A root may interrupt an agent of its own run.
  rpc InterruptAgent(InterruptAgentRequest) returns (InterruptAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "interrupt"
      summary: "Interrupt an agent's turn, as Esc does in its terminal"
    };
  }

  // Create a one-time pairing token and QR/link payload for pairing a new device. Only the host's own device, or
  // the root of the setup run (`StartSetup`), may call this.
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_ROOT, ACTOR_CLASS_DEVICE]
      write: true
      cli: "pair"
      summary: "Create a one-time pairing token and QR/link payload for a device"
    };
  }

  // List paired devices. Only the host's own device, or the root of the setup run, may call this.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_ROOT, ACTOR_CLASS_DEVICE]
      cli: "devices"
      summary: "List paired devices"
    };
  }

  // Revoke a paired device's token and close its active streams. Only the host's own device may call this.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "revoke-device"
      summary: "Revoke a paired device"
    };
  }

  // Revoke the calling device's own pairing and close its streams: how a paired app unpairs itself. The host's own
  // device can't be revoked.
  rpc RevokeSelf(RevokeSelfRequest) returns (RevokeSelfResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      write: true
      cli: "revoke-self"
      summary: "Revoke this device's own pairing"
    };
  }

  // Register the calling device's UnifiedPush endpoint (WebPush, RFC 8030/8291) for notifications with the app
  // closed. One endpoint per device: a new one replaces the old, and an endpoint another device held moves here.
  // A device registers only itself; revoking the device deletes it.
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE, ACTOR_CLASS_READ_ONLY_DEVICE]
      write: true
      cli: "register-push"
      summary: "Register this device's UnifiedPush endpoint"
    };
  }

  // Remove a device's push endpoint: the caller's own, or (the host's own device only) another device's.
  rpc UnregisterPush(UnregisterPushRequest) returns (UnregisterPushResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE, ACTOR_CLASS_READ_ONLY_DEVICE]
      write: true
      cli: "unregister-push"
      summary: "Remove a device's push endpoint"
    };
  }

  // Send a test notification to a device's push endpoint: the caller's own, or (the host's own device only)
  // another device's. Answers once the push service took it, or with its error.
  rpc TestPush(TestPushRequest) returns (TestPushResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE, ACTOR_CLASS_READ_ONLY_DEVICE]
      write: true
      cli: "test-push"
      summary: "Send a test notification to a device's push endpoint"
    };
  }

  // Start the first-run setup agent, or return the one that is running (a retired one is resumed): a lead agent in a
  // run flagged `setup`, in a scratch repo of the host's own, that follows `protocol/SETUP.md` of the share folder.
  // The apps call it once connected; `mesh setup` does the same.
  rpc StartSetup(StartSetupRequest) returns (StartSetupResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "setup"
      summary: "Start the setup agent that helps connect repos, machines and devices"
    };
  }

  // The host's built-in Tailscale node (`meshd --tailscale`): its state, the login URL while it needs one, and its
  // tailnet addresses. Only the host's own device, or the root of the setup run, may call this: the login URL
  // attaches the node to whichever tailnet opens it.
  rpc TailnetStatus(TailnetStatusRequest) returns (TailnetStatusResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_ROOT, ACTOR_CLASS_DEVICE]
      cli: "tailnet"
      summary: "Show the host's built-in Tailscale node: state, login URL, addresses"
    };
  }

  // Quota usage for Claude and agy, what each agy tier would start on, and the reserve threshold.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "usage"
      summary: "Show Claude and agy quota usage and the reserve"
    };
  }

  // Let a run go on past the quota reserve (`off`), hold it to it again (`on`), or read its state.
  rpc SetReserve(SetReserveRequest) returns (SetReserveResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "reserve"
      summary: "Let a run past the quota reserve (off) or hold it to it (on)"
    };
  }

  // Ask a question, or have a pull request reviewed. A fresh read-only agent starts, or an existing one is asked
  // again; a round of reviewers is collected into one answers file and one message to you.
  rpc Ask(AskRequest) returns (AskResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER
      ]
      write: true
      cli: "ask"
      summary: "Ask a question or have a PR reviewed (a round of reviewers is collected into one file and one message)"
    };
  }

  // Record the judge's verdict on one reviewer's findings of a PR's newest round: the PR author's (a worker: its
  // own newest round, never one the root asked) or the root's (which replaces it).
  rpc RecordVerdict(RecordVerdictRequest) returns (RecordVerdictResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "verdict"
      summary: "Record your verdict on a reviewer's findings of a PR's latest round"
    };
  }

  // List the asks and review rounds of a run.
  rpc ListAsks(ListAsksRequest) returns (ListAsksResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "asks"
      summary: "List the asks and review rounds of a run, with who answered"
    };
  }

  // The standing peers: cloned projects, each a read-only asker that keeps its conversation across runs.
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "peers"
      summary: "List the standing peers by group, with what each is for and when it was last asked"
    };
  }

  // Register a project as a peer: clone a URL (or use a clone that exists) and give it a worktree of its own.
  rpc AddPeer(AddPeerRequest) returns (AddPeerResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "add-peer"
      summary: "Register a project as a standing peer (clones a URL under peers.dir)"
    };
  }

  // Change what a peer, or a group of peers, is said to be for.
  rpc EditPeer(EditPeerRequest) returns (EditPeerResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "edit-peer"
      summary: "Change the about of a peer or of a peer group"
    };
  }

  // Remove a peer from the registry and its worktree (and, if asked, the clone the daemon made).
  rpc RemovePeer(RemovePeerRequest) returns (RemovePeerResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "remove-peer"
      summary: "Remove a standing peer"
    };
  }

  // Register the peers of bin/mesh's peers.json (read only), each with its conversation (session, folder, last ask) unless
  // that may still be running in bin/mesh or `unbriefed` is set; a registered peer never asked is given its conversation too.
  rpc ImportPeers(ImportPeersRequest) returns (ImportPeersResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "import-peers"
      summary: "Import the peers of bin/mesh's peers.json (read only), with their conversations"
    };
  }

  // Tokens per agent, kind, model and phase from session files (Claude, agy and OpenCode alike), plus reviewer verdicts.
  // The total is input + cache writes + output; cache reads are listed apart. Dollars are Claude's at API prices, context only.
  rpc GetCost(GetCostRequest) returns (GetCostResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "cost"
      summary: "Tokens per agent, kind and phase (dollars at API prices beside them), from session files"
    };
  }

  // Check listed model families against the tiers: flag new or retired families, and acknowledge decided ones.
  rpc CheckModels(CheckModelsRequest) returns (CheckModelsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "models"
      summary: "Check model families each CLI lists against the tiers (new and retired); --ack records a decision"
    };
  }

  // What a spawn of a kind and tier would run now: the model and effort, and the tier's chain with each model's
  // standing (held at a limit, at the quota reserve). The same pick a spawn makes; it starts nothing.
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "model"
      summary: "Show the model and effort a spawn of a kind and tier would run"
    };
  }

  // Find which run branches with commits conflict with their base or each other, and which workers share files.
  rpc CheckConflicts(CheckConflictsRequest) returns (CheckConflictsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "conflicts"
      summary: "Check which run branches conflict with their base or each other, and which workers share files"
    };
  }

  // List what a lean Claude session starts without (tools, skills, plugins, MCP servers, connectors) and what it
  // added back.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "tools"
      summary: "List what a lean Claude session runs without and what it added back"
    };
  }

  // Add cut tools, skills, plugins, MCP servers, `anthropic-skills`, or `claude.ai` connectors back to a lean
  // Claude session by reopening the same conversation at its next idle.
  rpc AddTools(AddToolsRequest) returns (AddToolsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "tools-add"
      summary: "Add cut tools, skills, plugins or MCP servers back via reopen"
    };
  }

  // An agent's hook asks for the answer to a permission prompt its CLI is about to show: held until the agent's
  // parent decides (`mesh permission`) or the wait runs out, which leaves the prompt to the person at the terminal.
  rpc RequestPermission(RequestPermissionRequest) returns (RequestPermissionResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER
      ]
      summary: "Ask the agent's parent to answer a permission prompt (from its hook)"
    };
  }

  // Answer a worker's pending permission prompt: allow it, or deny it with a reason the worker reads.
  rpc DecidePermission(DecidePermissionRequest) returns (DecidePermissionResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "permission"
      summary: "Allow or deny a pending permission prompt of an agent"
    };
  }

  // The permission prompts waiting for an answer: the caller's own agents' (a device: every run's).
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "permissions"
      summary: "List pending permission prompts"
    };
  }

  // List the user's MCP servers, which load always, which are exclusive, and who currently holds each exclusive one.
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "tools-servers"
      summary: "List the user's MCP servers and exclusive holders"
    };
  }

  // Create a run worktree with no agent in it (e.g. for integration), cleaned up when the run stops.
  rpc CreateWorktree(CreateWorktreeRequest) returns (CreateWorktreeResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "worktree"
      summary: "Create a run worktree with no agent in it, e.g. for integration"
    };
  }

  // The run's events and messages as a timeline (sends, nudges, alerts, swaps...).
  rpc StreamLog(StreamLogRequest) returns (stream StreamLogResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_ASKER,
        ACTOR_CLASS_REVIEWER,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "log"
      summary: "Show the run's events as a timeline (sends, nudges, alerts, swaps...)"
    };
  }

  // What an agent's worktree holds that isn't on a remote yet: the files changed since the commit its branch started at,
  // uncommitted work, and commits no remote branch has.
  rpc GetAgentChanges(GetAgentChangesRequest) returns (GetAgentChangesResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "changes"
      summary: "Show the files an agent changed, its uncommitted work and its commits not pushed"
    };
  }

  // An agent's progress as its CLI's record shows it: the plan it keeps (Claude's TodoWrite list) and how much context
  // its conversation holds. Only a CLI whose record the daemon reads has any (Claude Code).
  rpc GetAgentProgress(GetAgentProgressRequest) returns (GetAgentProgressResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_DEVICE,
        ACTOR_CLASS_READ_ONLY_DEVICE
      ]
      cli: "progress"
      summary: "Show an agent's plan progress and context size from its CLI's record"
    };
  }

  // Archive an agent: retire it and remove its worktree, keeping its branch. Refused while the worktree has uncommitted
  // changes, and, without `force`, while the branch has commits no remote branch has. A message to the agent or
  // ResumeAgent brings it back: the worktree is made again from the branch.
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "archive"
      summary: "Retire an agent and remove its worktree, keeping its branch (refused with uncommitted or unpushed work)"
    };
  }

  // Open a path of an agent's worktree in the host's editor (the `editor.command` setting, run without a shell with the
  // path as one argument). The host's own device only: it runs a program on the host's machine.
  rpc OpenInEditor(OpenInEditorRequest) returns (OpenInEditorResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "open-in-editor"
      summary: "Open a path of an agent's worktree in the host's editor"
    };
  }

  // Turn the built-in Tailscale node on or off. Takes effect at the next start of meshd: when it runs under a service
  // manager it restarts itself. The host's own device only.
  rpc SetTailnet(SetTailnetRequest) returns (SetTailnetResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      write: true
      cli: "set-tailnet"
      summary: "Turn the host's Tailscale node on or off (meshd restarts)"
    };
  }

  // Re-ring an agent that has unread mail now, through the doorbell delivery path and draft guard.
  rpc RingAgent(RingAgentRequest) returns (RingAgentResponse) {
    option (action) = {
      actors: [
        ACTOR_CLASS_ROOT,
        ACTOR_CLASS_WORKER,
        ACTOR_CLASS_DEVICE
      ]
      write: true
      cli: "ring"
      summary: "Re-ring an agent that has unread messages"
    };
  }

  // Attach to a running agent's terminal, or reopen a stopped agent's conversation in your terminal outside any run.
  // Intentionally write: false (no RequestMeta): one-time terminal tickets must not be stored or replayed from
  // mutations, and standalone worktree preparation before exec is idempotent.
  rpc OpenAgent(OpenAgentRequest) returns (OpenAgentResponse) {
    option (action) = {
      actors: [ACTOR_CLASS_DEVICE]
      cli: "open"
      summary: "Attach to a running agent, or reopen a past agent's conversation in this terminal"
    };
  }
}

message HelloRequest {
  string client = 1;
  // The protocol major version the client speaks.
  int32 protocol_version = 2;
}

message HelloResponse {
  // Stable per host (kept in its state dir).
  string daemon_id = 1;
  // Changes on every daemon start.
  string instance_id = 2;
  google.protobuf.Timestamp started_at = 3;
  int32 protocol_version = 4;
  string version = 5;
  repeated string capabilities = 6;
  // The caller, as its token says.
  Actor actor = 7;
  // The host's clock when it answered. A client measures how far its own clock is from the host's with it, to
  // judge whether an event's time is recent (the host's clock may be minutes off, WSL's often is).
  google.protobuf.Timestamp server_time = 8;
}

message StartRunRequest {
  RequestMeta meta = 1;
  string title = 2;
  // What the user lets this run's root do without asking: replaces the host's repo autonomy lists for this run.
  RunAutonomy autonomy = 3;
}

message RenameRunRequest {
  RequestMeta meta = 1;
  string run_id = 2;
  string title = 3;
}

message RenameRunResponse {
  Run run = 1;
}

message OpenViewRequest {
  RequestMeta meta = 1;
  // "agent" (its chat), "terminal" (its terminal), "settings", "run" (the run's lead), "messages" (an agent's Messages tab, or
  // the run lead's), "plan" (the Messages tab of the agent that wrote the plan, at its newest plan) or "pr" (the agent that
  // owns the pull request, with its side panel).
  string view = 2;
  // The agent's name or id for "agent", "terminal", "messages" and "plan" (for "messages" a run's id too); the run's id for
  // "run"; a settings section for "settings" (may be empty); a pull request's URL or `#number` for "pr".
  string target = 3;
  // The run the target is in, when `target` is an agent's name.
  string run_id = 4;
}

message OpenViewResponse {
  // How many apps were sent it (live subscribers of a device's token). Zero means no app is connected. An app acts on
  // it as a toast, or by itself with `app.open_views` on, so this does not say a view was shown.
  int32 delivered = 1;
}

// An agent or the CLI asked the user's app to show a view. Ephemeral: never stored or replayed. An app acts on it only
// as a toast the user opens or dismisses, and by itself only when the user turned `app.open_views` on (never while they type).
message ViewRequest {
  string view = 1;
  string target = 2;
  string run_id = 3;
  // Who asked, for the app to say ("agent-mesh-lead opened…").
  string from = 4;
  // For "plan": the plan message to show (`target` is its author's id).
  string message_id = 5;
  // For "pr": the agent that owns the pull request (`target` is its URL).
  string agent_id = 6;
}

message StartRunResponse {
  Run run = 1;
  // Notice when a CLI lists model families no tier names (or no longer lists one a tier names).
  string model_notice = 2;
}

message StartSetupRequest {
  RequestMeta meta = 1;
  // The CLI adapter; empty means the first installed of claude, agy, opencode, copilot.
  string kind = 2;
  // The tier it runs on; empty means `mid`.
  string tier = 3;
}

message StartSetupResponse {
  Agent agent = 1;
  Run run = 2;
  // True when the agent was already running and nothing was started.
  bool already_running = 3;
}

message ListRunsRequest {
  // Include closed runs.
  bool all = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message SpawnAgentRequest {
  RequestMeta meta = 1;
  // Defaults to the caller's run for an agent; required for a device.
  string run_id = 2;
  // The git repository: a path, or a bare name of a folder of the repos.dir setting.
  string repo = 3 [(path) = true, (repo_name) = true];
  // Names the branch (mesh/<run>/<slug>) and the agent (<repo>-<slug>).
  string slug = 4;
  AgentRole role = 5;
  // The CLI adapter, such as "claude".
  string kind = 6;
  // A model named for it (the user named one); otherwise give a tier. One of the two is required: there is no
  // default model.
  string model = 7;
  // Overrides the tier's effort (or, with a named model, defaults to high).
  string effort = 8;
  // The branch or commit to start the worktree from; empty means the remote's default branch (origin/HEAD, as
  // last fetched), else the repo's HEAD.
  string base = 9;
  // The first message, sent as a task once the agent is ready.
  string task = 10;
  // The tier (`tiers.<kind>.<tier>`: light, mid, strong, top) it runs on, or plans on when plan is set: the
  // first model of its chain at its effort.
  string tier = 11;
  // The task has a plan phase: it plans (a Claude agent under the deny list) until ApproveAgent moves it to
  // its execution tier.
  bool plan = 12;
  // The execution tier, when known before the plan is read; ApproveAgent may name another.
  string exec_tier = 13;
  // Names of the user's MCP servers the agent loads besides the always-loaded ones (the claude.mcp_keep setting),
  // such as "playwright" for a frontend worker. A Claude agent only, and only while the claude.lean setting is on
  // (else every server loads already).
  repeated string mcp = 14;
  // Who runs the review rounds of this worker's PR: "worker", "relay" (the worker runs them as a relay, for a risky PR)
  // or "root"; empty means the `review.by` setting.
  string reviews = 15;
}

message SpawnAgentResponse {
  Agent agent = 1;
  // How many more agents fit on this host now, and how many workers work (`mesh brief` prints the same line):
  // "7 more agents fit (9 of 16 live, caps.agents auto); 6 of 8 workers working (caps.working auto)". Empty on
  // a retried spawn.
  string capacity = 2;
}

message ListAgentsRequest {
  // Empty means every open run.
  string run_id = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message GetAgentRequest {
  // An agent id, or a name (within the caller's run, or unique across open runs).
  string agent = 1;
}

message GetAgentResponse {
  Agent agent = 1;
  // The models it ran on, oldest first: its spawn, then each reopen that moved it (approve, switch, quota, resume).
  repeated ModelSwap model_history = 2;
}

message ChangedFile {
  string path = 1;
  // "added", "modified", "deleted", "renamed" or "untracked".
  string status = 2;
  int32 additions = 3;
  int32 deletions = 4;
  // Not committed yet (a tracked file edited, or an untracked one).
  bool uncommitted = 5;
}

message GetAgentChangesRequest {
  // Agent id or name.
  string agent = 1;
  // Also list the git-ignored files the worktree holds that archiving would delete (`ignored`): a walk of the worktree,
  // so only when asked.
  bool with_ignored = 2;
}

// A git-ignored file of a worktree, or a whole git-ignored folder (`node_modules/`), with what it holds.
message IgnoredEntry {
  string path = 1;
  // Bytes in it (files only), counted up to a limit.
  int64 bytes = 2;
  // The count stopped at the limit: there is more.
  bool partial = 3;
}

message GetAgentChangesResponse {
  // The files that differ from the commit the branch started at, uncommitted work included, most changed first, at most 200.
  repeated ChangedFile files = 1;
  bool truncated = 2;
  // Files with uncommitted changes (tracked or untracked).
  int32 uncommitted = 3;
  // Commits past the commit the branch started at, and how many of them no remote branch has.
  int32 commits = 4;
  int32 unpushed = 5;
  // The agent has a worktree on disk and it could be read.
  bool available = 6;
  // Why it could not be read (no worktree, archived, git failed).
  string reason = 7;
  // With `with_ignored`: the git-ignored entries of the worktree that `.worktreeinclude` does not bring back, largest first,
  // at most 20, and how many more there are.
  repeated IgnoredEntry ignored = 8;
  int32 ignored_more = 9;
}

message PlanItem {
  string content = 1;
  // "pending", "in_progress" or "completed".
  string status = 2;
}

message GetAgentProgressRequest {
  // Agent id or name.
  string agent = 1;
}

message GetAgentProgressResponse {
  // False for a CLI whose record the daemon doesn't read (everything below is empty).
  bool supported = 1;
  // The newest TodoWrite list of the conversation, in order; empty when the agent has none.
  repeated PlanItem plan = 2;
  // The conversation's size now: the newest reply's prompt since the last compaction. Zero when unknown.
  int64 context_tokens = 3;
  // The model's context window, as the daemon guesses it from the model's name (200000, or 1000000 for a `1m` model).
  int64 context_window = 4;
}

message ArchiveAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
  // Archive although the branch has commits no remote branch has (uncommitted changes always refuse).
  bool force = 3;
}

message ArchiveAgentResponse {
  Agent agent = 1;
  int32 unpushed = 2;
}

message OpenInEditorRequest {
  RequestMeta meta = 1;
  string agent = 2;
  // A path under the agent's worktree (relative to it, or absolute); empty opens the worktree itself.
  string path = 3;
}

message OpenInEditorResponse {
  // What was opened, as an absolute path.
  string opened = 1;
}

message SetTailnetRequest {
  RequestMeta meta = 1;
  bool enabled = 2;
}

message SetTailnetResponse {
  // The setting now (kept in the host's state dir).
  bool enabled = 1;
  // meshd restarts itself in a moment for it to take effect.
  bool restarting = 2;
  // It takes effect when meshd is next restarted (it does not run under a service manager).
  bool restart_needed = 3;
  // Nothing was changed, and why (already on or off; the node is on because meshd was started with --tailscale).
  string note = 4;
}

message ModelSwap {
  google.protobuf.Timestamp time = 1;
  string model = 2;
  string effort = 3;
  // "spawned", or the reopen's reason: "plan approved", "moved", "quota", "resumed", "reset".
  string why = 4;
}

message StopAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
}

message StopAgentResponse {
  Agent agent = 1;
}

message SendMessageRequest {
  RequestMeta meta = 1;
  // An agent id or name, or "parent" for the caller's parent.
  string to = 2;
  MessageType type = 3;
  string body = 4;
  // Only for a wait to your own parent (mesh send parent --type wait): when it ends, as a duration from now (45m, 2h) or an RFC 3339 time. Until then
  // the daemon holds its nudge for the agent (a wake still ends the wait early); it is capped at
  // accountability.wait_max, and without it a wait lasts that long. A negative, zero or unparsable value, or one
  // on another message type or a wait to anyone but your parent, is refused.
  string until = 5;
  // A report to your parent: the id of the task it answers (the id in the task's `mesh inbox` header). Refused when
  // a newer task came since, after a done for the task, or for a second failed. Empty: the report answers your
  // current task. Only a plan, question, done or failed to your parent takes it.
  string re = 6;
}

message SendMessageResponse {
  Message message = 1;
  // The reopen the message caused: a task, answer or question to a retired or stopped agent resumes it.
  Reopen resumed = 2;
  // Why a message that should have resumed a stopped agent did not (the host's agent cap or memory floor, a
  // closed run, no conversation to resume). The message is stored either way and waits for the agent's next
  // resume.
  string resume_error = 3;
}

message ReadInboxRequest {
  RequestMeta meta = 1;
  // Show unread messages without marking them read.
  bool peek = 2;
  // Include messages already read.
  bool all = 3;
  // Print every body whole. A root's `plan` and `done` messages longer than `inbox.summary_over` characters come
  // back as a summary (their key parts, the file they are kept in, and this flag's command); other callers
  // always get whole bodies.
  bool full = 4;
  // Only this message of yours (any read state), whole: read a summarised plan or report in full. Marks it
  // read unless peek is set.
  string id = 5;
}

message ReadInboxResponse {
  repeated Message messages = 1;
}

message AdoptSessionRequest {
  RequestMeta meta = 1;
  string run_id = 2;
  // The Claude Code process to adopt and its start in clock ticks (`mesh adopt` finds the session above it
  // and fills both in).
  int32 pid = 3;
  uint64 pid_start_ticks = 4;
}

message AdoptSessionResponse {
  Agent agent = 1;
  // What changed, in a line: a new root, or the run's own taken over.
  string note = 2;
}

message CheckAgentRequest {
  // An agent id, or a name (within the caller's run, or unique across open runs).
  string agent = 1;
}

message CheckAgentResponse {
  // The report, as text: commits, diff stat, pushed and clean, PRs and their checks.
  string text = 1;
}

message ListMessagesRequest {
  // The run whose messages to list.
  string run_id = 1;
  // Only messages after this one (the last of the previous page); empty starts at the oldest.
  string after_id = 2;
  // At most this many; 0 means 500, and more than 2000 is capped to 2000.
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // There are more messages after these.
  bool more = 2;
}

message ListWaitingRequest {
  // Only this run's; empty means every open run (an agent's own run, whatever it asks).
  string run_id = 1;
}

message ListWaitingResponse {
  repeated Waiting waiting = 1;
}

enum WaitingKind {
  WAITING_KIND_UNSPECIFIED = 0;
  // A plan to approve or send back.
  WAITING_KIND_PLAN = 1;
  // A question to answer.
  WAITING_KIND_QUESTION = 2;
  // An agent stopped at a prompt in its terminal (a permission, say).
  WAITING_KIND_INPUT = 3;
}

// One thing that waits on the user.
message Waiting {
  WaitingKind kind = 1;
  string run_id = 2;
  // The agent that wrote the plan or question, or is stopped at a prompt.
  string agent_id = 3;
  // The plan or question; unset for a prompt.
  Message message = 4;
  // For a prompt, why the agent is stopped (its state detail).
  string detail = 5;
}

message SubscribeEventsRequest {
  // Resume after this cursor; unset starts from a snapshot.
  Cursor cursor = 1;
  // Only this run's events; empty means all.
  string run_id = 2;
  // Also send the ephemeral AgentActivity frames (the tool an agent runs now). Off by default: a client that wants
  // state changes only (`mesh events`) would otherwise get a frame per tool call. The desktop sets it.
  bool activity = 3;
}

message SubscribeEventsResponse {
  oneof frame {
    // The current runs and agents; the events that follow come after cursor.
    Snapshot snapshot = 1;
    // The cursor was resumed: the events that follow come after it.
    Resumed resumed = 2;
    Event event = 3;
    // The stream ends on purpose (the daemon is shutting down); reconnect from the last cursor.
    End end = 4;
    // What an agent is doing now. Ephemeral: never stored, never replayed after a resume, and skipped (not a
    // reason to drop the subscriber) when the subscriber is behind. A state change is an Event, as before.
    AgentActivity activity = 5;
    // An agent or the CLI asked the user's app to show a view (`OpenView`). Sent to the live subscribers of a device's
    // token only; ephemeral, like `activity`.
    ViewRequest view = 6;
  }
}

// The tool an agent's CLI is running, reported by its hooks. A tool call that changes no state writes no Event
// (that would log every tool call), so it is this frame, sent to the live subscribers of its run only.
message AgentActivity {
  string run_id = 1;
  string agent_id = 2;
  // The tool now running (the agent's state detail).
  string detail = 3;
  google.protobuf.Timestamp time = 4;
}

message Snapshot {
  Cursor cursor = 1;
  repeated Run runs = 2;
  repeated Agent agents = 3;
}

message Resumed {
  Cursor from = 1;
}

message End {
  string reason = 1;
}

message ReportHookRequest {
  // Its mutation_id is the hook call's own id, so a spooled hook that is also sent applies once.
  RequestMeta meta = 1;
  // The adapter kind the hook belongs to.
  string kind = 2;
  // The CLI's event name, such as "Stop".
  string event_name = 3;
  // The hook's stdin, verbatim.
  bytes payload = 4;
  // When the hook fired (a spooled one is sent later).
  google.protobuf.Timestamp fired_at = 5;
}

message ReportHookResponse {
  // The agent's state after the hook.
  AgentState state = 1;
  // Text the hook prints, which the CLI adds to the session's context (a SessionStart reminder).
  string context = 2;
}

message ResetRootRequest {
  RequestMeta meta = 1;
  // What the root does next after the reset; the bootstrap line carries it.
  string next = 2;
  // Compact the session instead of starting a fresh one (a Claude root only).
  bool compact = 3;
  // The run (a device names it; a root's is its own).
  string run_id = 4;
  // What a compacting reset keeps; empty is the CLI's own default.
  string focus = 5;
}

message ResetRootResponse {
  RootReset root_reset = 1;
  // Notes: why nothing was started, or what it waits for.
  repeated string notes = 2;
}

message GetBriefRequest {
  // The run (a device names it; an agent's is its own).
  string run_id = 1;
  // An agent whose brief this is (a device names it); default the caller, else the run's root.
  string agent = 2;
}

message GetBriefResponse {
  // The brief, as text.
  string text = 1;
}

message OpenTerminalRequest {
  // The agent whose terminal to open. Exactly one of `agent` and `shell`.
  string agent = 1;
  // Ask for input rights; granted only to actors with the terminal.input right.
  bool input = 2;
  // A project shell's id (`ListShells`): a ticket for `/v1/shell/<id>`. Devices only.
  string shell = 3;
}

message OpenShellRequest {
  RequestMeta meta = 1;
  // The project: a repo path, or a bare name of a folder of `repos.dir`; it must be one the host knows (`ListProjects`'s sources).
  string repo = 2 [(path) = true, (repo_name) = true];
}

message OpenShellResponse {
  Shell shell = 1;
}

message ListShellsRequest {}

message ListShellsResponse {
  repeated Shell shells = 1;
}

message CloseShellRequest {
  RequestMeta meta = 1;
  string id = 2;
}

message CloseShellResponse {}

// A plain shell in a project's folder, held by the terminal host.
message Shell {
  string id = 1;
  // The project folder it runs in (absolute).
  string repo = 2;
  google.protobuf.Timestamp started_at = 3;
  // The shell ended; its stream still ends with the exit, then it is forgotten.
  bool exited = 4;
  int32 exit_code = 5;
}

message OpenTerminalResponse {
  // The WebSocket path on the daemon's listener, ticket included.
  string path = 1;
  string ticket = 2;
  bool input = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ListSettingsRequest {
  // Only settings whose key starts with this; empty lists every one.
  string prefix = 1;
}

message ListSettingsResponse {
  repeated Setting settings = 1;
}

message SetSettingRequest {
  RequestMeta meta = 1;
  string key = 2;
  google.protobuf.Value value = 3;
}

message SetSettingResponse {
  Setting setting = 1;
}

message ResetSettingRequest {
  RequestMeta meta = 1;
  string key = 2;
}

message ResetSettingResponse {
  Setting setting = 1;
}

message ImportSettingsRequest {
  RequestMeta meta = 1;
  // The policy file; default the one meshd was started with (--policy-file). It is only read.
  string from = 2 [(path) = true];
  // Replace a setting that is already set (by mesh set or an app); by default it is left as it is.
  bool overwrite = 3;
  // Say what would be imported and write nothing.
  bool dry_run = 4;
}

message ImportedSetting {
  string key = 1;
  google.protobuf.Value value = 2;
  // The file's own key when it isn't `key` (`repos_dir`, `copilot_model`).
  string from = 3;
}

message ImportSettingsResponse {
  // The file read.
  string file = 1;
  // What was stored (with `dry_run`, what would be); a value equal to the setting's current one is not listed.
  repeated ImportedSetting imported = 2;
  // Keys of the file left alone, each with why ("no such setting", "already set", "not used by the daemon", a rule).
  repeated string skipped = 3;
  // The request was a dry run: nothing was written.
  bool dry_run = 4;
}

message ApproveAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
  // The execution tier; without it, the one preset at spawn. Or a model (and effort) named instead.
  string tier = 3;
  string model = 4;
  string effort = 5;
  // Execute on the planning model; only the deny list is lifted (still a reopen, for a Claude planner).
  bool keep_model = 6;
  // Added to the "approved" answer.
  string body = 7;
  // Why this tier, recorded on the reopen.
  string why = 8;
  // Who runs the review rounds of this worker's PR from now on: "worker", "relay" or "root"; empty leaves it as it is.
  string reviews = 9;
}

message ApproveAgentResponse {
  Agent agent = 1;
  Message message = 2;
  // The reopen this asked for; unset when nothing changed (the same model and effort, no deny list).
  Reopen reopen = 3;
}

message SwitchAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
  // One of: a tier, a model, an effort alone (the same model: Claude keeps its cache), or next.
  string tier = 3;
  string model = 4;
  string effort = 5;
  // The next model of its phase's tier chain: its model hit a quota.
  bool next = 6;
  string why = 7;
}

message SwitchAgentResponse {
  Agent agent = 1;
  Message message = 2;
  Reopen reopen = 3;
}

message ResumeAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
  // A task to resume it for; empty brings it back as it was.
  string task = 3;
  // The task has a plan phase (it plans under the deny list, on tier: given, else the tier it had).
  bool plan = 4;
  string tier = 5;
  string model = 6;
  string effort = 7;
  string why = 8;
  // Target run to resume into (defaults to the caller's run for a root, or the stopped agent's run for a device).
  string run_id = 9;
  // Compact the conversation first: "" or "auto" when it is big enough (`compact.*`), "yes" always, "no" never.
  string compact = 10;
  // What the compaction keeps, instead of the default for the task.
  string focus = 11;
  // Replace the agent's extra MCP servers on resume (Claude only; "none" clears them). Empty carries over what it
  // had, dropping any exclusive server another live agent now holds.
  repeated string mcp = 12;
}

message ResumeAgentResponse {
  Agent agent = 1;
  // The task, when one was given.
  Message message = 2;
  Reopen reopen = 3;
  // Notes about the resume (such as a branch move away from a merged or closed PR).
  repeated string notes = 4;
  // URL of the merged or closed PR whose branch the resume moved off, if any.
  string left_pr = 5;
}

message CreatePairingRequest {
  RequestMeta meta = 1;
  // Optional label for the device (the redeeming app may override it).
  string name = 2;
  // Issue a read-only device token when redeemed.
  bool read_only = 3;
  // Lifetime in seconds (default 600, max 86400).
  int64 ttl_seconds = 4;
  // Optional direct HTTPS URL (`https://host:port`) to include in the pairing payload.
  string direct_url = 5;
  // Optional relay URL override; defaults to the daemon's configured relay URL.
  string relay_url = 6;
}

message CreatePairingResponse {
  string pairing_id = 1;
  // One-time pairing token (`amp_...`).
  string token = 2;
  string host_id = 3;
  string host_name = 4;
  // Canonical TLS leaf certificate fingerprint (`sha256:<64-hex>`).
  string cert_fingerprint = 5;
  string relay_url = 6;
  // Raw TCP client endpoint (`host:port`) on the relay, when configured.
  string relay_tcp = 7;
  // The relay token (`amr_...`) of the device this pairing makes, when a relay is configured. The relay accepts it
  // while the pairing is open and, once redeemed, until the device is revoked.
  string relay_client_token = 8;
  string direct_url = 9;
  // Canonical `agentmesh://pair?...` URI for QR codes and pairing links.
  string uri = 10;
  google.protobuf.Timestamp expires_at = 11;
}

message ListDevicesRequest {
  bool include_revoked = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  RequestMeta meta = 1;
  string device_id = 2;
}

message RevokeDeviceResponse {
  Device device = 1;
}

message RevokeSelfRequest {
  RequestMeta meta = 1;
}

message RevokeSelfResponse {
  Device device = 1;
}

message RegisterPushRequest {
  RequestMeta meta = 1;
  // The push endpoint URL the distributor gave the app: `https://`, or `http://` to a loopback host.
  string endpoint = 2;
  // The device's P-256 public key, uncompressed, base64url (RFC 8291 `p256dh`).
  string p256dh = 3;
  // The 16-byte authentication secret, base64url (RFC 8291 `auth`).
  string auth = 4;
  // What this device is pushed: kinds from the app.notify.events choices (input, plan, question, report, failed,
  // exited, limited, error). Empty follows the host's app.notify.events; app.notify.enabled still switches every
  // push off. A registration replaces the earlier one's list, so an app sends its current choice each time.
  repeated string events = 5;
}

message RegisterPushResponse {
  PushRegistration registration = 1;
}

message UnregisterPushRequest {
  RequestMeta meta = 1;
  // Empty: the caller's own. Another device's only for the host's own device.
  string device_id = 2;
}

message UnregisterPushResponse {
  // Whether there was an endpoint to remove.
  bool removed = 1;
}

message TestPushRequest {
  RequestMeta meta = 1;
  // Empty: the caller's own. Another device's only for the host's own device.
  string device_id = 2;
}

message TestPushResponse {
  PushRegistration registration = 1;
}

message TailnetStatusRequest {}

message TailnetStatusResponse {
  // Whether meshd runs with `--tailscale`. The other fields are empty when it doesn't.
  bool enabled = 1;
  // Tailscale's backend state: `NoState`, `NeedsLogin`, `NeedsMachineAuth`, `Starting`, `Running` or `Stopped`.
  string state = 2;
  // The URL to open to log the node in, while the state is `NeedsLogin`.
  string auth_url = 3;
  // The node's name on the tailnet.
  string hostname = 4;
  // The node's MagicDNS name, when the tailnet has one.
  string dns_name = 5;
  // The node's tailnet addresses.
  repeated string addresses = 6;
  // The control server (a Headscale URL), empty for Tailscale's own.
  string control_url = 7;
  // The direct address a pairing link carries for this node (`https://<tailnet IPv4>[:port]`, or its IPv6 address in
  // brackets when it has no IPv4 one), once it runs.
  string direct_url = 8;
  // Why the node isn't running, when Tailscale says (health warnings, a start error).
  repeated string problems = 9;
}

message RetireAgentRequest {
  RequestMeta meta = 1;
  string agent = 2;
}

message RetireAgentResponse {
  Agent agent = 1;
}

message StopRunRequest {
  RequestMeta meta = 1;
  string run_id = 2;
}

message StopRunResponse {
  Run run = 1;
  // The agents this call retired (those already stopped are not listed).
  repeated string retired = 2;
  // What became of each agent's worktree.
  repeated WorktreeOutcome worktrees = 3;
}

message WorktreeOutcome {
  string agent_id = 1;
  string worktree = 2;
  string branch = 3;
  bool worktree_removed = 4;
  // The branch moved past its start or was pushed (a remote branch of its name), or its worktree stayed: it is kept.
  bool branch_kept = 5;
  // Why a worktree or branch stayed.
  string reason = 6;
}

message GetUsageRequest {
  // Bypass cached usage readings and fetch fresh ones.
  bool refresh = 1;
}

message ClaudeUsageWindow {
  // Window key ("five_hour", "seven_day", "seven_day_opus", "seven_day_sonnet").
  string key = 1;
  // Human-readable window label ("five-hour window", ...).
  string label = 2;
  // Percent of the window used (0 to 100).
  double used = 3;
  // When the window resets, if known.
  google.protobuf.Timestamp resets_at = 4;
}

message ClaudeUsage {
  repeated ClaudeUsageWindow windows = 1;
  google.protobuf.Timestamp fetched_at = 2;
  // Where the reading came from ("statusline", "live", or "cache").
  string source = 3;
  // Labels of windows currently at or over quota_stop.
  repeated string at_reserve = 4;
}

message AgyUsageRow {
  string group = 1;
  string label = 2;
  int32 left = 3;
  string resets = 4;
}

message AgyTierPick {
  string tier = 1;
  string model = 2;
  // Percent left of the picked model's tightest quota, when has_left is true.
  int32 left = 3;
  bool has_left = 4;
  repeated string notes = 5;
}

message GetUsageResponse {
  ClaudeUsage claude = 1;
  repeated AgyUsageRow agy_rows = 2;
  repeated AgyTierPick agy_tiers = 3;
  int32 quota_stop = 4;
  int32 min_quota = 5;
  // What the readings can't say: a CLI whose usage can't be read until the user logs in to it.
  repeated string notes = 6;
}

message SetReserveRequest {
  RequestMeta meta = 1;
  // "on" (hold to quota_stop) or "off" (let the run past the reserve); empty inspects the current state.
  string mode = 2;
  // Run id (defaults to the caller's own run for a root; required for a device).
  string run_id = 3;
}

message SetReserveResponse {
  Run run = 1;
  bool over_reserve = 2;
  int32 quota_stop = 3;
  string summary = 4;
}

message RequestPermissionRequest {
  // The tool the CLI is about to run and what it would do: a command, or a path. Never file contents.
  string tool = 1;
  string summary = 2;
}

message RequestPermissionResponse {
  // "allow" or "deny" when the parent decided; empty when nobody did in time (the prompt stays on the screen).
  string decision = 1;
  // The parent's reason for a denial, which the agent reads.
  string reason = 2;
}

message DecidePermissionRequest {
  RequestMeta meta = 1;
  // The prompt's id, from the message the parent got or `mesh permissions`.
  string id = 2;
  // "allow" or "deny".
  string decision = 3;
  // Why a prompt is denied, and what to do instead: the agent reads it.
  string why = 4;
}

message DecidePermissionResponse {
  PendingPermission permission = 1;
}

message ListPermissionsRequest {
  // Only this run's (a device's default: every open run's).
  string run_id = 1;
}

message ListPermissionsResponse {
  repeated PendingPermission permissions = 1;
}

// A permission prompt an agent's CLI is about to show, held for its parent's answer.
message PendingPermission {
  string id = 1;
  string run_id = 2;
  string agent_id = 3;
  string agent_name = 4;
  string parent_id = 5;
  string tool = 6;
  // A command or a path, cut short; never file contents.
  string summary = 7;
  google.protobuf.Timestamp since = 8;
}

message HoldPullRequestRequest {
  RequestMeta meta = 1;
  // The PR's url, as ListPullRequests gives it.
  string url = 2;
  // Release the hold instead of placing it (refused for a root).
  bool release = 3;
}

message HoldPullRequestResponse {
  // The PR as recorded now, once for each agent that owns it.
  repeated PullRequest pull_requests = 1;
}

message ListProjectsRequest {
  // Only this repo (a path or a bare name of a `repos.dir` folder), fetched from its origin first, and with its open
  // pull requests read from GitHub: the full list is quick (it asks git, not the network) and has none. A read-only
  // device may name only a repo the full list has, and gets the refs last fetched and no pull requests.
  string repo = 1 [(path) = true, (repo_name) = true];
}

// A pull request a workspace can start from: the branch to start the worktree on.
message ProjectPullRequest {
  int32 number = 1;
  string title = 2;
  // The PR's head branch, as `base` of SpawnAgent takes it (a ref of the repo's remote).
  string head_ref = 3;
  string url = 4;
  bool draft = 5;
  // The head is a branch of a fork: `head_ref` names the fork's branch, not one of the repo's remote, so the PR can't be
  // started from by it.
  bool cross_repository = 6;
}

message Project {
  // The repo's top folder on the host: what SpawnAgent's `repo` takes.
  string path = 1;
  // Its folder's name.
  string name = 2;
  // Its default branch (the remote's HEAD), empty when it can't be told.
  string default_branch = 3;
  // Branches of the repo, newest commit first, the first few dozen, as refs SpawnAgent's `base` takes: a local branch by
  // its name, the remote's as origin/<name>.
  repeated string branches = 4;
  // Only when ListProjects was asked for this one repo.
  repeated ProjectPullRequest pull_requests = 5;
  // Found in a `repos.dir` folder (false: only seen as an agent's repo).
  bool in_repos_dir = 6;
  // When an agent last worked in it, if one did.
  google.protobuf.Timestamp last_used = 7;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}
