syntax = "proto3";

package agentmesh.v1;

import "agentmesh/v1/actor.proto";
import "agentmesh/v1/context.proto";
import "agentmesh/v1/pr.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RequestMeta comes with every write. A retried write with the same mutation id returns the first result
// instead of running twice, and a write that arrives after expires_at is refused, so a delayed tap neither
// runs twice nor runs late. Events a write causes carry its mutation id.
message RequestMeta {
  // Chosen by the client, unique per intended write (a UUID).
  string mutation_id = 1;
  // Refuse the write after this time; unset means no expiry.
  google.protobuf.Timestamp expires_at = 2;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_OPEN = 1;
  RUN_STATUS_CLOSED = 2;
}

message Run {
  string id = 1;
  string title = 2;
  RunStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  // Who started it.
  Actor created_by = 5;
  // True when the user let this run go on past the quota reserve (`mesh reserve off`).
  bool over_reserve = 6;
  // True for the run the first-run setup agent lives in (`StartSetup`): its root may also pair devices and read the
  // tailnet, which only the host's own device may otherwise.
  bool setup = 7;
  // The user's autonomy for this run, set when it starts (`StartRunRequest.autonomy`); unset means the host's
  // settings alone apply. When set it replaces the settings' repo lists for this run (unless `keep_repo_lists`), and
  // its `ask_before` is added to the settings'.
  RunAutonomy autonomy = 8;
}

// What the user lets this run's root do without asking, for every repo of the run.
message RunAutonomy {
  // The user approves this run's plans and merges its PRs: the root never `mesh approve`s a plan or merges.
  bool user_approves_plans = 1;
  // The user merges this run's PRs: the root never merges one (it may still approve plans).
  bool user_merges = 2;
  // Things the root asks the user before doing, for this run only.
  repeated string ask_before = 3;
  // Keep the host's repo lists (`repos.user_approves_plans`, `repos.user_merges`) for this run too, and only add
  // `ask_before`: the two flags above are then ignored.
  bool keep_repo_lists = 4;
}

// AgentRole is an agent's place in its run. It is also its token's actor class.
enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  AGENT_ROLE_ROOT = 1;
  AGENT_ROLE_WORKER = 2;
  AGENT_ROLE_ASKER = 3;
  AGENT_ROLE_REVIEWER = 4;
}

// AgentState is what the agent's state reducer derived from its CLI's hooks and process events.
enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  // Launched; its CLI hasn't reported a session yet.
  AGENT_STATE_STARTING = 1;
  // Waiting for input at its prompt.
  AGENT_STATE_IDLE = 2;
  // In a turn.
  AGENT_STATE_WORKING = 3;
  // Stopped at a permission prompt or a question to the user.
  AGENT_STATE_NEEDS_INPUT = 4;
  // Its process ended.
  AGENT_STATE_EXITED = 5;
  // Working, but nothing heard from it for a while. Derived when read, never stored.
  AGENT_STATE_UNKNOWN = 6;
  // Stopped on purpose (RetireAgent, idle after its report, StopRun): its process is gone and its token
  // revoked, its conversation and worktree kept. A message to it, or ResumeAgent, brings it back.
  AGENT_STATE_RETIRED = 7;
  // Stopped on a quota or rate limit (RESOURCE_EXHAUSTED 429, usage limit): ready for SwitchAgent.
  AGENT_STATE_LIMITED = 8;
  // Turn ended in an error.
  AGENT_STATE_ERROR = 9;
}

message Agent {
  string id = 1;
  string run_id = 2;
  // `<repo>-<slug>`, unique within its run.
  string name = 3;
  AgentRole role = 4;
  // The agent that started it; empty for one a device started.
  string parent_id = 5;
  // The CLI adapter's kind, such as "claude".
  string kind = 6;
  // The repository it works in, and its worktree and branch there.
  string repo = 7;
  string worktree = 8;
  string branch = 9;
  string model = 10;
  string effort = 11;
  // The CLI's conversation id.
  string session_id = 12;
  // The terminal host's id for its PTY.
  string terminal_id = 13;
  AgentState state = 14;
  // How many reasons it currently needs input for (permission prompts, questions).
  int32 needs_input = 15;
  // A short reason for the state, such as the permission prompt's tool.
  string state_detail = 16;
  google.protobuf.Timestamp last_activity = 17;
  google.protobuf.Timestamp created_at = 18;
  // Set once it exited.
  int32 exit_code = 19;
  // What state the agent was in when a compaction began (a compaction has no turn of its own): restored when
  // the compacted session starts. UNSPECIFIED when none is under way.
  AgentState state_before_compact = 20;
  // The tier its model came from (`tiers.<kind>.<tier>`), for its planning or only phase; empty for a named
  // model.
  string tier = 21;
  // The execution phase's tier: preset at spawn, or named at approval.
  string exec_tier = 22;
  AgentPhase phase = 23;
  // A model or effort named for the whole task: it never gets a plan phase.
  bool pinned = 24;
  // The running CLI denies edits under its worktree and the main checkout, and publishing (an asker, a reviewer,
  // or a planner not yet approved). Only a reopen changes it: deny rules are given at launch.
  bool deny_edits = 25;
  // A reopen asked for and not done yet: it runs at the agent's next IDLE, before any doorbell.
  Reopen pending_reopen = 26;
  // The commit its branch started at (its worktree's HEAD when it was spawned); empty for an agent that predates
  // it. StopRun keeps a branch that has moved past it.
  string base_commit = 27;
  // When resumed from an earlier run, the run and agent id it came from.
  string resumed_from_run_id = 28;
  string resumed_from_agent_id = 29;
  // A standing peer's agent in this run (`mesh ask --peers`): it works in the peer's own worktree, resumes the
  // peer's conversation, and is never given a change task or have its worktree removed.
  bool peer = 30;
  // The user's MCP servers the spawn asked for (`mesh spawn --mcp`), loaded on top of the always-loaded ones
  // (`claude.mcp_keep`); every reopen keeps them.
  repeated string mcp = 31;
  // A `/compact` asked for while it is live (approve, follow-up round), typed at its next quiet prompt.
  PendingCompaction pending_compaction = 32;
  // A root's reset asked for and not done yet, and the last one finished (or failed).
  RootReset pending_reset = 33;
  RootReset last_reset = 34;
  // Its last turn began with a mesh doorbell, not the user's prompt (a root's reset waits 5 minutes after one,
  // 30 after the user's). Unknown for a CLI whose hooks carry no prompt.
  bool last_turn_by_mesh = 35;
  // Lean session items added back via `mesh tools add` (built-in tool names, skills, plugin bare names,
  // `anthropic-skills`). Stored separately from `mcp` so resuming doesn't conflate plugin/skill names with MCP servers.
  repeated string added_tools = 36;
  // True once a built-in tool was added back, so every reopen passes `--system-prompt-snapshot off`.
  bool tools_added = 37;
  // True once `claude.ai` connectors were added back (loads the user's full MCP config without `--strict-mcp-config`).
  bool mcp_all = 38;
  // Who runs the review rounds of this worker's PR: "worker" (it asks them itself) or "root" (its parent does:
  // a relay for a risky PR). Empty means the `review.by` setting.
  string review_by = 39;
  // A root that is the user's own Claude Code session, adopted by `mesh adopt`: the process (pid and its start in
  // clock ticks) the daemon doorbells through its inbox socket. It has no terminal, worktree or branch of the
  // daemon's, and the daemon never signals it.
  int32 adopted_pid = 40;
  uint64 adopted_pid_start = 41;
  // Archived (`ArchiveAgent`): retired, its worktree removed and its branch kept. A message to it or ResumeAgent
  // recreates the worktree from the branch and clears this.
  bool archived = 42;
  // A plain agent (`SpawnAgent.plain`): the user's own conversation with a CLI, started from the app as a run's root
  // with no task. The mesh never resets or compacts it, and sends it no root reminders or context hints.
  bool plain = 43;
}

// AgentPhase is where an agent is in a task that has a plan: planning until approved, then executing.
enum AgentPhase {
  // No plan phase: a direct task, a question, or a named model.
  AGENT_PHASE_UNSPECIFIED = 0;
  AGENT_PHASE_PLANNING = 1;
  AGENT_PHASE_EXECUTING = 2;
}

// Reopen is a relaunch of an agent's own conversation (`claude --resume <session>`) on another model, effort or
// deny list. A model change is always a reopen of the same conversation, never a fresh agent.
message Reopen {
  // Unique per request: the terminal it launches carries it as a label, so a daemon that died mid-launch finds
  // the terminal it started instead of starting a second one.
  string id = 1;
  string model = 2;
  string effort = 3;
  bool deny_edits = 4;
  // "plan approved", "moved", "quota", "resumed", "reset".
  string why = 5;
  // The caller's own reason, when it gave one.
  string reason = 6;
  google.protobuf.Timestamp requested_at = 7;
  Actor requested_by = 8;
  // Launch a fresh conversation, not a resume of the agent's own: a root's reset. Its old conversation id is
  // cleared; the new process records its own.
  bool fresh = 9;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TASK = 1;
  MESSAGE_TYPE_PLAN = 2;
  MESSAGE_TYPE_QUESTION = 3;
  MESSAGE_TYPE_ANSWER = 4;
  MESSAGE_TYPE_DONE = 5;
  MESSAGE_TYPE_FAILED = 6;
  MESSAGE_TYPE_INFO = 7;
  MESSAGE_TYPE_WAIT = 8;
}

message Message {
  string id = 1;
  string run_id = 2;
  Actor from = 3;
  // The recipient agent's id.
  string to_id = 4;
  string to_name = 5;
  MessageType type = 6;
  string body = 7;
  google.protobuf.Timestamp created_at = 8;
  // When its doorbell reached the recipient's terminal; unset until then.
  google.protobuf.Timestamp delivered_at = 9;
  // When the recipient read it with ReadInbox; unset until then.
  google.protobuf.Timestamp read_at = 10;
  // A wait's own deadline, already capped at accountability.wait_max from its time; unset without one.
  google.protobuf.Timestamp wait_until = 11;
  // A report (plan, question, done, failed) to the sender's parent: the id of the task it answers, the sender's
  // current task when it was sent. Empty for any other message.
  string re = 12;
}

// Cursor is a position in the host's event log. A cursor from another generation (the log was recreated) can't
// be resumed: the stream starts over from a snapshot.
message Cursor {
  string generation = 1;
  int64 seq = 2;
}

// Event is one entry of the host's event log: durable, numbered and replayable. Ephemeral frames are not
// events.
message Event {
  int64 seq = 1;
  string generation = 2;
  google.protobuf.Timestamp time = 3;
  string run_id = 4;
  string agent_id = 5;
  // Who caused it: the actor of the action, or the agent whose hook reported it.
  Actor actor = 6;
  // The mutation id of the write that caused it, if any.
  string mutation_id = 7;
  oneof payload {
    RunStarted run_started = 10;
    AgentSpawned agent_spawned = 11;
    AgentStateChanged agent_state_changed = 12;
    MessageSent message_sent = 13;
    MessageDelivered message_delivered = 14;
    AgentExited agent_exited = 15;
    AgentAdopted agent_adopted = 16;
    HookDecodeFailed hook_decode_failed = 17;
    SettingChanged setting_changed = 18;
    AgentReopenRequested agent_reopen_requested = 19;
    AgentReopened agent_reopened = 20;
    AgentPhaseChanged agent_phase_changed = 21;
    AgentReopenDropped agent_reopen_dropped = 22;
    DevicePaired device_paired = 25;
    DeviceRevoked device_revoked = 26;
    AgentRetired agent_retired = 23;
    RunStopped run_stopped = 24;
    ReserveChanged reserve_changed = 27;
    AgentRoleChanged agent_role_changed = 28;
    AgentCompacted agent_compacted = 29;
    RootResetRequested root_reset_requested = 30;
    RootResetFinished root_reset_finished = 31;
    DoorbellFailed doorbell_failed = 32;
    DoorbellHeld doorbell_held = 33;
    WorktreeCreated worktree_created = 34;
    PullRequestChanged pull_request_changed = 35;
    PromptQueued prompt_queued = 36;
    PromptTyped prompt_typed = 37;
    PromptWithdrawn prompt_withdrawn = 38;
    RunRenamed run_renamed = 39;
    PermissionChanged permission_changed = 40;
    AgentArchived agent_archived = 41;
  }
}

// A prompt the user sent an agent's chat that waits to be typed into its terminal (`PromptAgent`, `ListPrompts`).
message QueuedPrompt {
  string id = 1;
  string agent_id = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  // Who sent it (a device).
  Actor from = 5;
  // What it waits for now, for the app to say: "working", "starting", "at_prompt", "limited", "stopped", "draft" (a
  // human's draft is in the agent's box), "typing" (someone types in its terminal), "no_box" (its screen shows no
  // input box), or empty when it is due. Set by ListPrompts; the queue's order is the order they are typed in.
  string held = 6;
  // With `held` "draft": the text the daemon read in the agent's box (whitespace squeezed; empty when it is too long to show whole,
  // 2000 characters: then `SendPromptAnyway` is not offered), for the app to show before it offers `SendPromptAnyway`. Set by
  // ListPrompts and by the answer that queued the prompt; never in the event log.
  string held_text = 7;
}

// A prompt was queued for an agent (`PromptAgent` while it couldn't take one).
message PromptQueued {
  QueuedPrompt prompt = 1;
}

// A queued prompt was typed into the agent's terminal.
message PromptTyped {
  string prompt_id = 1;
}

// A queued prompt was taken back before it was typed (`WithdrawPrompt`).
message PromptWithdrawn {
  string prompt_id = 1;
}

message Worktree {
  string id = 1;
  string run_id = 2;
  string slug = 3;
  string repo = 4;
  string path = 5;
  string branch = 6;
  string base_commit = 7;
  google.protobuf.Timestamp created_at = 8;
}

message WorktreeCreated {
  Worktree worktree = 1;
}

// A run's title changed (`RenameRun`).
message RunRenamed {
  string title = 1;
  string previous = 2;
}

// A permission prompt of an agent's CLI was held for its parent, or ended. The list of pending prompts is in the
// daemon's memory only (`ListPermissions`); this event tells an app to list it again, and carries no prompt text.
message PermissionChanged {
  // The prompt's id, as `ListPermissions` gives it.
  string id = 1;
  string agent_name = 2;
  // "asked" (held for the parent), "allowed" or "denied" (the parent or a device answered), "ended" (answered at the
  // agent's terminal, ran out, or the agent went on).
  string state = 3;
}

// An agent was archived: its worktree removed, its branch kept (`ArchiveAgent`).
message AgentArchived {
  string worktree = 1;
  string branch = 2;
  // Commits of its branch no remote branch has, when it was archived (0 for a branch that was pushed).
  int32 unpushed = 3;
  // Archived although it had unpushed commits (`force`).
  bool forced = 4;
}

message RunStarted {
  Run run = 1;
}

message AgentSpawned {
  Agent agent = 1;
}

message AgentStateChanged {
  AgentState from = 1;
  AgentState to = 2;
  string detail = 3;
  int32 needs_input = 4;
}

message MessageSent {
  Message message = 1;
}

message MessageDelivered {
  string message_id = 1;
  // How the doorbell was known to have got through: "socket" (written into the CLI's inbox, then the agent
  // worked), "turn" (typed, then the agent started working), "screen" (its ref showed above the input box),
  // "read" (the agent read the message first). Empty: a message stored delivered (no doorbell was needed).
  string via = 2;
  // How many times the doorbell was typed or written before one counted.
  int32 tries = 3;
}

// A doorbell was typed or written again and again and never got through (the agent's input never took it, or it
// sat at a dialog the CLI's hooks didn't report). Nothing is typed again until the agent's state next changes; the
// messages stay unread.
message DoorbellFailed {
  repeated string message_ids = 1;
  int32 tries = 2;
  string reason = 3;
}

// A doorbell has waited for a human's draft in the agent's input box to go for a long time (`delivery.draft_hold_alert`).
// It is never typed into the draft.
message DoorbellHeld {
  repeated string message_ids = 1;
  string reason = 2;
  // The draft's first characters.
  string draft = 3;
}

message AgentExited {
  int32 exit_code = 1;
  int32 signal = 2;
  // "exited", "killed", or "lost" (its terminal was gone when the daemon looked).
  string reason = 3;
}

// The agent's terminal is recorded: a launch has just started it (AgentSpawned was written before it existed), or
// the daemon found it still running at boot and took it back.
message AgentAdopted {
  string terminal_id = 1;
  // The terminal was started by a launch just now, not found running at boot: `mesh log` says "launched".
  bool launched = 2;
}

// A reopen was asked for. It runs at once when the agent is idle or stopped, else at its next IDLE.
message AgentReopenRequested {
  Reopen reopen = 1;
}

// The agent's conversation was relaunched in a new terminal: same agent, session and worktree.
message AgentReopened {
  Reopen reopen = 1;
  string terminal_id = 2;
  string session_id = 3;
}

// A reopen asked for was not done: the agent was stopped first, or its relaunch failed (then the agent is
// EXITED, and ResumeAgent tries again).
message AgentReopenDropped {
  Reopen reopen = 1;
  string reason = 2;
}

// An agent was retired: its process stopped on purpose.
message AgentRetired {
  // "requested", "idle after its report", "run stopped".
  string reason = 1;
}

// A run was stopped: its agents retired and the run closed.
message RunStopped {}

// A run's quota reserve override changed (`mesh reserve on|off`).
message ReserveChanged {
  bool over_reserve = 1;
}

message AgentPhaseChanged {
  AgentPhase from = 1;
  AgentPhase to = 2;
  // "planned task", "plan sent", "plan approved", "direct task".
  string why = 3;
}

// An asker or reviewer was given a change to make and became a worker, in the same conversation. Its live
// tokens now carry the worker's class.
message AgentRoleChanged {
  AgentRole from = 1;
  AgentRole to = 2;
  // "change task", "planned change task".
  string why = 3;
}

// A hook's payload couldn't be decoded. Never read as any other event.
message HookDecodeFailed {
  string event_name = 1;
  string error = 2;
}

// A setting was set or reset. Global: it carries no run, and every subscriber gets it. The actor and mutation id
// of the write are on the event.
message SettingChanged {
  string key = 1;
  // The effective value now (the default after a reset), and what it was before.
  google.protobuf.Value value = 2;
  google.protobuf.Value previous = 3;
  // True when the setting went back to its default.
  bool to_default = 4;
}

// What a setting's value may be, enough for a client to draw its editor and validate before it sends.
message SettingSchema {
  // One of: string, strings, int, percent, bool, seconds, effort, chain, slots, kinds, mb_or_auto, int_or_auto, json,
  // shortcut, chat_key.
  //   string      a non-empty string
  //   strings     a list of strings
  //   int         a whole number, 0 or more
  //   percent     a whole number, 0 to 100
  //   bool        true or false
  //   seconds     a finite number, 0 or more
  //   effort      one of the choices
  //   chain       a non-empty list of model names, tried in order
  //   slots       a list of slots, each a non-empty list of choices (agent kinds)
  //   kinds       a list of choices (agent kinds)
  //   mb_or_auto  "auto" or a whole number of MB, 0 or more
  //   int_or_auto "auto" or a whole number, 0 or more
  //   json        any JSON value
  //   shortcut    a key chord such as "Mod+Shift+P" (a modifier besides Shift, or a function key), or "" for none
  //   chat_key    a key the chat's composer acts on: a named key alone ("Escape", "ArrowUp") or a chord, or ""
  string type = 1;
  string summary = 2;
  // The values a dropdown offers: an effort's levels, the agent kinds a `kinds` or `slots` entry may name.
  repeated string choices = 3;
  // Read only when the daemon starts: a change takes effect at the next restart.
  bool restart = 4;
  // What a settings screen calls it, in sentence case: "Retire idle agents after".
  string label = 5;
  // The section it is listed under: Appearance, Notifications, Shortcuts, Agents and models, Reviews, Projects and
  // autonomy, Limits and quota or Delivery.
  string group = 6;
  // True for a setting that is folded away in its group until asked for: tuning most people never touch.
  bool advanced = 7;
}

// One setting: its effective value, what it falls back to, and who last set it.
message Setting {
  // A dotted path, such as "tiers.claude.mid.model".
  string key = 1;
  // The effective value: the override when is_set, else the default.
  google.protobuf.Value value = 2;
  google.protobuf.Value default = 3;
  // True when a value was set; false when the built-in default applies.
  bool is_set = 4;
  SettingSchema schema = 5;
  // When the override was set and by whom; unset while is_set is false.
  google.protobuf.Timestamp updated_at = 6;
  Actor updated_by = 7;
}

// A paired client device.
message Device {
  string id = 1;
  string name = 2;
  ActorClass class = 3;
  google.protobuf.Timestamp created_at = 4;
  // Set once revoked.
  google.protobuf.Timestamp revoked_at = 5;
  // The device's push endpoint, when it registered one.
  PushRegistration push = 6;
}

// A device's push endpoint, as `mesh devices` shows it. The endpoint's URL is a capability (whoever holds it can
// push to the phone), so only its host is shown.
message PushRegistration {
  string device_id = 1;
  string endpoint_host = 2;
  google.protobuf.Timestamp registered_at = 3;
  // The last push the push service accepted.
  google.protobuf.Timestamp last_ok_at = 4;
  // The last failure, cleared by the next success.
  string last_error = 5;
  // Since when every push has failed; unset while pushes go through.
  google.protobuf.Timestamp failing_since = 6;
  // What the device chose to be pushed (RegisterPushRequest.events); empty follows the host's list.
  repeated string events = 7;
}

message DevicePaired {
  Device device = 1;
  // The pairing (CreatePairingResponse.pairing_id) the device redeemed, so a client can tell which link it came
  // from. Events from before this field have it empty.
  string pairing_id = 2;
}

message DeviceRevoked {
  string device_id = 1;
  string name = 2;
}
