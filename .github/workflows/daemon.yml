# The daemon's checks: daemon/scripts/check.sh (buf lint and breaking, generated code current, gofmt, vet, and
# `go test -race`). Run the same script locally; this only runs it on a clean machine. It does not run the Python
# suite (bin/mesh, tests/): nothing under proto/ or daemon/ touches it.
name: daemon

on:
  pull_request:
    paths: ["proto/**", "daemon/**", ".github/workflows/daemon.yml"]
  push:
    branches: [main]
    paths: ["proto/**", "daemon/**", ".github/workflows/daemon.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history: `buf breaking` compares against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.75.0
          github_token: ${{ github.token }}
      # The runner has gcc as `cc`, which the race detector needs.
      - run: SKIP_PYTEST=1 daemon/scripts/check.sh
